<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rowing マルチストップウォッチ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS for P2P Realtime Sync -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- SheetJS for Excel & CSV Export -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    button, input, label, select {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10 text-slate-800 antialiased selection:bg-blue-200">

  <div class="max-w-[1600px] mx-auto px-2 pt-2">

    <!-- ヘッダー・操作コントロールバー -->
    <header class="bg-white/95 backdrop-blur-md p-2 rounded-xl shadow-md border border-slate-200/80 mb-3 sticky top-1 z-30">
      
      <!-- ステータス ＆ 部屋コード ＆ 補助機能 -->
      <div class="flex flex-wrap items-center justify-between gap-1 border-b border-slate-100 pb-1.5 mb-1.5 text-xs">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span id="statusBadge" class="px-1.5 py-0.5 font-bold rounded-full bg-amber-100 text-amber-800 flex items-center gap-1 text-[10px] border border-amber-300">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="statusText">接続準備中...</span>
          </span>
          <div class="flex items-center gap-1 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200 text-[10px]">
            <span class="text-slate-500 font-medium">共有ID:</span>
            <span id="roomCodeDisplay" class="font-mono font-bold text-blue-600"></span>
          </div>
        </div>

        <div class="flex items-center gap-1">
          <button onclick="copyShareUrl()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-bold px-1.5 py-0.5 rounded text-[10px] transition active:scale-95">
            URLコピー
          </button>
          <button onclick="resetAllTimersWithSound()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-bold px-1.5 py-0.5 rounded text-[10px] transition active:scale-95">
            全体リセット
          </button>
        </div>
      </div>

      <!-- メインコントロール -->
      <div class="flex flex-wrap items-center justify-between gap-1.5">
        <div class="flex items-center gap-2">
          <label class="flex items-center gap-1 cursor-pointer font-bold text-slate-700 bg-slate-50 px-1.5 py-0.5 rounded border border-slate-200 hover:bg-slate-100 transition text-[11px]">
            <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(event)" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
            <span>全選択</span>
          </label>
          <div class="font-bold bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded border border-blue-200 text-[11px]">
            艇数: <span id="count" class="text-xs text-blue-800 font-black">0</span> / 100
          </div>
        </div>

        <!-- コントロールボタン群 -->
        <div class="flex flex-wrap items-center gap-1 text-[11px]">
          <!-- 選択START -->
          <button onclick="batchStartWithSound()" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold px-2 py-1 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
            選択START
          </button>

          <!-- 全体STOP -->
          <button onclick="stopAllTimersWithSound()" class="bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white font-bold px-2 py-1 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"></path></svg>
            全体STOP
          </button>

          <!-- 追加 -->
          <button onclick="addTimer()" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold px-2 py-1 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            追加
          </button>

          <!-- 削除 -->
          <button onclick="removeTimer()" class="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold px-2 py-1 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
            削除
          </button>

          <!-- スマホ用：画面で結果表示 -->
          <button onclick="openPreviewModal()" class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold px-2 py-1 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
            データ表示
          </button>

          <!-- エクセル出力 -->
          <button onclick="exportExcel()" class="bg-emerald-700 hover:bg-emerald-800 active:bg-emerald-900 text-white font-bold px-2 py-1 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95">
            <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
            Excel出力
          </button>

          <!-- CSV出力 -->
          <button onclick="exportCsv()" class="bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-bold px-2 py-1 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95">
            <svg class="w-3 h-3 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
            CSV出力
          </button>

          <!-- LINE転送 -->
          <button onclick="shareLine()" class="bg-[#06C755] hover:bg-[#05b34c] active:bg-[#049b42] text-white font-bold px-2 py-1 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95">
            <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M24 10.304c0-5.369-5.383-9.738-12-9.738-6.616 0-12 4.369-12 9.738 0 4.814 4.269 8.846 10.036 9.608.391.084.922.258 1.057.592.122.303.079.778.039 1.085l-.171 1.027c-.053.303-.242 1.186 1.039.647 1.281-.54 6.911-4.069 9.428-6.967 1.739-1.907 2.572-3.844 2.572-6.002z"/></svg>
            LINE転送
          </button>
        </div>
      </div>
    </header>

    <!-- 通知トースト -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white px-3.5 py-2 rounded-xl shadow-2xl text-xs font-bold transition-all transform translate-y-20 opacity-0 z-50 flex items-center gap-2 border border-slate-700">
      <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      <span id="toastMsg">URLをコピーしました！</span>
    </div>

    <!-- スマホ・画面上での結果表示用モーダル -->
    <div id="previewModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4">
      <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
        
        <!-- モーダルヘッダー -->
        <div class="p-3 bg-slate-800 text-white flex items-center justify-between border-b border-slate-700">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            <h3 class="font-bold text-sm">計測データプレビュー (SPLIT)</h3>
          </div>
          <button onclick="closePreviewModal()" class="text-slate-400 hover:text-white p-1 rounded-lg transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>

        <!-- テーブル表示領域（スクロール可） -->
        <div class="p-3 overflow-auto flex-1 bg-slate-50">
          <div id="previewTableContainer" class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-x-auto"></div>
        </div>

        <!-- モーダルフッターボタン群 -->
        <div class="p-2.5 bg-white border-t border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">
          <button onclick="copyTableToClipboard()" class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1 transition active:scale-95">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
            クリップボードにコピー
          </button>

          <div class="flex items-center gap-1.5">
            <button onclick="exportExcel()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-2.5 py-1.5 rounded-lg shadow-sm">
              Excel保存
            </button>
            <button onclick="exportCsv()" class="bg-teal-600 hover:bg-teal-700 text-white font-bold px-2.5 py-1.5 rounded-lg shadow-sm">
              CSV保存
            </button>
            <button onclick="closePreviewModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-1.5 rounded-lg">
              閉じる
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- ストップウォッチカード一覧 -->
    <main id="app" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2"></main>

  </div>

  <script>
    let state = { stopwatches: {} };
    let selectedIds = new Set();
    let isHost = false;
    let peer = null;
    let hostConn = null;
    let clientConns = [];

    let lastSyncServerTime = Date.now();
    let lastSyncLocalTime = Date.now();

    // 音声効果
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq = 880, type = 'sine', duration = 0.1) {
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn('Audio playback error:', e);
      }
    }

    function batchStartWithSound() { playBeep(1046.50, 'sine', 0.15); batchStart(); }
    function stopAllTimersWithSound() { playBeep(523.25, 'square', 0.18); stopAllTimers(); }
    function toggleStartWithSound(id) {
      const sw = state.stopwatches[id];
      playBeep(sw && sw.isRunning ? 659.25 : 880.00, 'sine', 0.12);
      toggleStart(id);
    }
    function addLapWithSound(id) { playBeep(1318.51, 'sine', 0.08); addLap(id); }
    function resetTimerWithSound(id) {
      const sw = state.stopwatches[id];
      if (!sw || sw.isRunning) return;
      playBeep(440.00, 'triangle', 0.1);
      resetTimer(id);
    }
    function resetAllTimersWithSound() { playBeep(349.23, 'triangle', 0.15); resetAllTimers(); }

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' },
          { urls: 'stun:stun2.l.google.com:19302' }
        ]
      }
    };

    let roomCode = location.hash.replace('#', '');
    if (!roomCode) {
      roomCode = 'rowing-' + Math.floor(1000 + Math.random() * 9000);
      location.hash = roomCode;
    }
    document.getElementById('roomCodeDisplay').innerText = roomCode;
    const hostPeerId = `rowing-app-room-v21-${roomCode}`;

    function getNow() {
      if (isHost) return Date.now();
      return lastSyncServerTime + (Date.now() - lastSyncLocalTime);
    }

    function initP2P() {
      try {
        peer = new Peer(hostPeerId, peerConfig);
        
        peer.on('open', () => {
          isHost = true;
          updateStatus('ホスト (親機)', 'bg-emerald-100 text-emerald-800 border-emerald-300');
        });

        peer.on('disconnected', () => {
          console.warn('PeerJS server disconnected. Attempting reconnect...');
          if (peer && !peer.destroyed) {
            peer.reconnect();
          }
        });

        peer.on('connection', (conn) => {
          clientConns.push(conn);
          conn.on('open', () => {
            conn.send({ type: 'SYNC_STATE', state, serverTime: Date.now() });
            updateHostStatus();
          });
          conn.on('data', (data) => dispatchAction(data));
          conn.on('close', () => { clientConns = clientConns.filter(c => c !== conn); updateHostStatus(); });
          conn.on('error', () => { clientConns = clientConns.filter(c => c !== conn); updateHostStatus(); });
        });

        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            isHost = false;
            peer = new Peer(peerConfig);
            peer.on('open', () => connectToHost());
            peer.on('disconnected', () => {
              if (peer && !peer.destroyed) peer.reconnect();
            });
          } else {
            console.error('Peer error:', err);
            updateStatus('通信エラー', 'bg-rose-100 text-rose-800 border-rose-300');
          }
        });
      } catch (e) {
        updateStatus('オフライン', 'bg-amber-100 text-amber-800 border-amber-300');
      }
    }

    function connectToHost() {
      updateStatus('ホストへ接続中...', 'bg-amber-100 text-amber-800 border-amber-300');
      hostConn = peer.connect(hostPeerId, { reliable: true });

      hostConn.on('open', () => {
        updateStatus('同期中 (子機)', 'bg-blue-100 text-blue-800 border-blue-300');
        hostConn.send({ type: 'REQUEST_SYNC' });
      });

      hostConn.on('data', (data) => {
        if (data.type === 'PING') return;
        if (data.type === 'SYNC_STATE') {
          if (data.serverTime) {
            lastSyncServerTime = data.serverTime;
            lastSyncLocalTime = Date.now();
          }
          state = data.state;
          renderStructure();
        }
      });

      hostConn.on('close', () => {
        updateStatus('切断 (再接続中...)', 'bg-rose-100 text-rose-800 border-rose-300');
        setTimeout(connectToHost, 3000);
      });

      hostConn.on('error', () => {
        updateStatus('接続失敗', 'bg-rose-100 text-rose-800 border-rose-300');
        setTimeout(connectToHost, 3000);
      });
    }

    // 放置・タイムアウト防止用ハートビート機能
    setInterval(() => {
      if (peer && peer.disconnected && !peer.destroyed) {
        peer.reconnect();
      }
      if (isHost) {
        clientConns.forEach(conn => {
          if (conn && conn.open) {
            conn.send({ type: 'PING' });
          }
        });
      } else if (hostConn && hostConn.open) {
        hostConn.send({ type: 'PING' });
      }
    }, 5000);

    // スマホのスリープ復帰時の自動再同期
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        if (peer && peer.disconnected && !peer.destroyed) {
          peer.reconnect();
        }
        if (!isHost) {
          if (!hostConn || !hostConn.open) {
            connectToHost();
          } else {
            hostConn.send({ type: 'REQUEST_SYNC' });
          }
        }
      }
    });

    function updateHostStatus() {
      if (isHost) {
        const count = clientConns.filter(c => c.open).length;
        updateStatus(`ホスト (接続端末: ${count}台)`, 'bg-emerald-100 text-emerald-800 border-emerald-300');
      }
    }

    function updateStatus(text, colorClass) {
      const badge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      if (badge && statusText) {
        statusText.innerText = text;
        badge.className = `px-1.5 py-0.5 font-bold rounded-full flex items-center gap-1 border text-[10px] ${colorClass}`;
      }
    }

    function dispatchAction(action) {
      if (action.type === 'PING') return;
      if (action.type === 'REQUEST_SYNC' && isHost) {
        broadcastState();
        return;
      }

      if (isHost) {
        handleAction(action);
        broadcastState();
      } else if (hostConn && hostConn.open) {
        hostConn.send(action);
      } else {
        handleAction(action);
      }
    }

    function handleAction(action) {
      const now = getNow();
      const keys = Object.keys(state.stopwatches);

      switch (action.type) {
        case 'ADD':
          if (keys.length >= 100) return alert("最大100艇まで追加可能です");
          const id = 'sw_' + now + '_' + Math.floor(Math.random() * 1000);
          state.stopwatches[id] = {
            id,
            name: `艇 ${keys.length + 1}`,
            isRunning: false,
            startTime: 0,
            accumulatedTime: 0,
            laps: []
          };
          break;

        case 'DELETE':
          delete state.stopwatches[action.id];
          selectedIds.delete(action.id);
          break;

        case 'DELETE_SELECTED':
          selectedIds.forEach(swId => delete state.stopwatches[swId]);
          selectedIds.clear();
          break;

        case 'REMOVE_LAST':
          if (keys.length > 0) {
            const lastId = keys[keys.length - 1];
            delete state.stopwatches[lastId];
            selectedIds.delete(lastId);
          }
          break;

        case 'RESET':
          if (state.stopwatches[action.id] && !state.stopwatches[action.id].isRunning) {
            state.stopwatches[action.id].startTime = 0;
            state.stopwatches[action.id].accumulatedTime = 0;
            state.stopwatches[action.id].laps = [];
          }
          break;

        case 'RESET_ALL':
          Object.keys(state.stopwatches).forEach(swId => {
            const sw = state.stopwatches[swId];
            if (sw && !sw.isRunning) {
              sw.startTime = 0;
              sw.accumulatedTime = 0;
              sw.laps = [];
            }
          });
          break;

        case 'STOP_ALL':
          Object.keys(state.stopwatches).forEach(swId => {
            const sw = state.stopwatches[swId];
            if (sw && sw.isRunning) {
              const currentSplit = sw.accumulatedTime + (now - sw.startTime);
              const laps = sw.laps || [];
              const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
              const lapDuration = currentSplit - lastSplit;

              laps.push({
                lapTime: formatTime(lapDuration),
                splitTime: formatTime(currentSplit),
                rawSplit: currentSplit,
                timestamp: now,
                type: 'STOP'
              });

              sw.accumulatedTime = currentSplit;
              sw.isRunning = false;
              sw.startTime = 0;
              sw.laps = laps;
            }
          });
          break;

        case 'TOGGLE_START':
          const sw = state.stopwatches[action.id];
          if (sw) {
            if (sw.isRunning) {
              const currentSplit = sw.accumulatedTime + (now - sw.startTime);
              const laps = sw.laps || [];
              const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
              const lapDuration = currentSplit - lastSplit;

              laps.push({
                lapTime: formatTime(lapDuration),
                splitTime: formatTime(currentSplit),
                rawSplit: currentSplit,
                timestamp: now,
                type: 'STOP'
              });

              sw.accumulatedTime = currentSplit;
              sw.isRunning = false;
              sw.startTime = 0;
              sw.laps = laps;
            } else {
              sw.isRunning = true;
              sw.startTime = now;
            }
          }
          break;

        case 'ADD_LAP':
          const swLap = state.stopwatches[action.id];
          if (swLap && swLap.isRunning) {
            const currentSplit = swLap.accumulatedTime + (now - swLap.startTime);
            const laps = swLap.laps || [];
            const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
            const lapDuration = currentSplit - lastSplit;

            laps.push({
              lapTime: formatTime(lapDuration),
              splitTime: formatTime(currentSplit),
              rawSplit: currentSplit,
              timestamp: now,
              type: 'LAP'
            });
            swLap.laps = laps;
          }
          break;

        case 'UPDATE_NAME':
          if (state.stopwatches[action.id]) {
            state.stopwatches[action.id].name = action.name;
          }
          break;

        case 'BATCH_START':
          (action.ids || []).forEach(swId => {
            const target = state.stopwatches[swId];
            if (target && !target.isRunning) {
              target.isRunning = true;
              target.startTime = now;
            }
          });
          break;
      }

      renderStructure();
    }

    function broadcastState() {
      const payload = { type: 'SYNC_STATE', state, serverTime: Date.now() };
      clientConns.forEach(conn => {
        if (conn && conn.open) conn.send(payload);
      });
    }

    window.addTimer = () => dispatchAction({ type: 'ADD' });
    window.deleteTimer = (id) => dispatchAction({ type: 'DELETE', id });
    window.removeTimer = () => {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("削除する艇がありません");
      if (selectedIds.size > 0) {
        if (confirm(`選択中の ${selectedIds.size} 艇を削除しますか？`)) dispatchAction({ type: 'DELETE_SELECTED' });
      } else {
        dispatchAction({ type: 'REMOVE_LAST' });
      }
    };
    window.resetTimer = (id) => dispatchAction({ type: 'RESET', id });
    window.stopAllTimers = () => dispatchAction({ type: 'STOP_ALL' });
    window.resetAllTimers = () => {
      if (confirm("停止中のストップウォッチをリセットしますか？（計測中の艇は維持されます）")) dispatchAction({ type: 'RESET_ALL' });
    };
    window.toggleStart = (id) => dispatchAction({ type: 'TOGGLE_START', id });
    window.addLap = (id) => dispatchAction({ type: 'ADD_LAP', id });
    window.updateName = (id, name) => dispatchAction({ type: 'UPDATE_NAME', id, name });
    window.batchStart = () => {
      if (selectedIds.size === 0) return alert("対象艇にチェックを入れて選択してください");
      dispatchAction({ type: 'BATCH_START', ids: Array.from(selectedIds) });
    };

    window.scrollLap = (id, direction) => {
      const container = document.getElementById(`lapContainer-${id}`);
      if (container) {
        const lineHeight = 24;
        container.scrollBy({ top: direction * lineHeight, behavior: 'smooth' });
      }
    };

    // mm:ss.00 形式フォーマット
    function formatTime(ms) {
      if (!ms || ms < 0) ms = 0;
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const h = Math.floor((ms % 1000) / 10);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(h).padStart(2, '0')}`;
    }

    function getElapsedTime(sw) {
      if (!sw) return 0;
      let elapsed = sw.accumulatedTime || 0;
      if (sw.isRunning && sw.startTime) {
        elapsed += (getNow() - sw.startTime);
      }
      return Math.max(0, elapsed);
    }

    window.toggleSelect = (id) => {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      renderStructure();
    };

    window.toggleSelectAll = (e) => {
      const keys = Object.keys(state.stopwatches);
      if (e.target.checked) keys.forEach(id => selectedIds.add(id));
      else selectedIds.clear();
      renderStructure();
    };

    window.shareLine = () => {
      const shareUrl = `${location.origin}${location.pathname}#${roomCode}`;
      const msg = `【Rowingマルチストップウォッチ】\nリアルタイム計測ルーム(ID: ${roomCode})に参加してください：\n${shareUrl}`;
      window.open(`https://line.me/R/msg/text/?${encodeURIComponent(msg)}`, '_blank');
    };

    // 出力用データ生成（SPLIT行のみ、P1, P2...ヘッダー）
    function generateExportData() {
      let maxLaps = 0;
      Object.values(state.stopwatches).forEach(sw => {
        const lCount = (sw.laps || []).length;
        if (lCount > maxLaps) maxLaps = lCount;
      });

      const header = ['艇名'];
      for (let i = 1; i <= maxLaps; i++) {
        header.push(`P${i}`);
      }
      const aoa = [header];

      Object.values(state.stopwatches).forEach(sw => {
        const laps = sw.laps || [];
        const splitRow = [sw.name];

        if (laps.length === 0) {
          splitRow.push(formatTime(getElapsedTime(sw)));
        } else {
          laps.forEach(lap => {
            splitRow.push(lap.splitTime);
          });
        }
        aoa.push(splitRow);
      });

      return aoa;
    }

    window.openPreviewModal = () => {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("表示するデータがありません");

      const aoa = generateExportData();
      const container = document.getElementById('previewTableContainer');

      let tableHtml = `<table class="w-full text-xs text-left border-collapse"><thead><tr class="bg-slate-100 text-slate-700 font-bold border-b border-slate-300">`;
      aoa[0].forEach(col => {
        tableHtml += `<th class="p-2 border-r border-slate-200 whitespace-nowrap">${col}</th>`;
      });
      tableHtml += `</tr></thead><tbody>`;

      for (let i = 1; i < aoa.length; i++) {
        const row = aoa[i];
        tableHtml += `<tr class="${i % 2 === 0 ? 'bg-slate-50/60' : 'bg-white'} border-b border-slate-200 hover:bg-blue-50/50">`;
        row.forEach((cell, cellIdx) => {
          const fontClass = cellIdx >= 1 ? 'font-mono' : 'font-bold';
          tableHtml += `<td class="p-2 border-r border-slate-200 whitespace-nowrap ${fontClass}">${cell || ''}</td>`;
        });
        tableHtml += `</tr>`;
      }
      tableHtml += `</tbody></table>`;

      container.innerHTML = tableHtml;
      document.getElementById('previewModal').classList.remove('hidden');
    };

    window.closePreviewModal = () => {
      document.getElementById('previewModal').classList.add('hidden');
    };

    window.copyTableToClipboard = () => {
      const aoa = generateExportData();
      const tsvText = aoa.map(row => row.join('\t')).join('\n');

      navigator.clipboard.writeText(tsvText).then(() => {
        showToast("クリップボードにコピーしました！");
      }).catch(err => {
        console.error("Copy failed:", err);
        alert("コピーに失敗しました");
      });
    };

    window.exportCsv = () => {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("出力するデータがありません");
      const today = new Date().toISOString().slice(0, 10);
      const userInput = prompt("保存するCSVファイル名を入力してください:", `Rowing_Result_${today}.csv`);
      if (userInput === null) return;
      const fileName = userInput.trim() || `Rowing_Result_${today}.csv`;
      const finalFileName = fileName.endsWith('.csv') ? fileName : `${fileName}.csv`;

      try {
        const aoa = generateExportData();
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "計測結果");
        
        XLSX.writeFile(wb, finalFileName, { bookType: 'csv' });
      } catch (err) {
        console.error("CSV Export error:", err);
        alert("CSVの保存に失敗しました。");
      }
    };

    window.exportExcel = () => {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("出力するデータがありません");
      const today = new Date().toISOString().slice(0, 10);
      const userInput = prompt("保存するExcelファイル名を入力してください:", `Rowing_Result_${today}.xlsx`);
      if (userInput === null) return;
      const fileName = userInput.trim() || `Rowing_Result_${today}.xlsx`;
      const finalFileName = fileName.endsWith('.xlsx') ? fileName : `${fileName}.xlsx`;

      try {
        const aoa = generateExportData();
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "計測結果");
        XLSX.writeFile(wb, finalFileName);
      } catch (err) {
        console.error("Excel Export error:", err);
        alert("Excelの保存に失敗しました。");
      }
    };

    window.copyShareUrl = () => {
      const shareUrl = `${location.origin}${location.pathname}#${roomCode}`;
      navigator.clipboard.writeText(shareUrl).then(() => showToast("共有URLをコピーしました！")).catch(() => prompt("以下のURLをコピーしてください:", shareUrl));
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (toast && toastMsg) {
        toastMsg.innerText = msg;
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
      }
    }

    function renderStructure() {
      const container = document.getElementById("app");
      const keys = Object.keys(state.stopwatches);
      document.getElementById("count").innerText = keys.length;

      const allSelected = keys.length > 0 && keys.every(id => selectedIds.has(id));
      const selectAllEl = document.getElementById("selectAllCheckbox");
      if (selectAllEl) selectAllEl.checked = allSelected;

      if (keys.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white p-6 rounded-xl shadow-sm text-center border border-slate-200 py-10">
            <p class="text-slate-700 font-bold text-sm mb-1">ストップウォッチがありません</p>
            <p class="text-xs text-slate-400 mb-3">「追加」を押して作成してください（最大100個）</p>
            <button onclick="addTimer()" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold px-3 py-1.5 rounded-lg shadow text-xs">
              追加
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = keys.map(id => {
        const sw = state.stopwatches[id];
        const laps = sw.laps || [];
        const isSelected = selectedIds.has(id);

        return `
          <div class="bg-white p-2 rounded-xl shadow-sm border transition-all ${
            sw.isRunning 
              ? 'border-emerald-500 ring-2 ring-emerald-100' 
              : isSelected 
                ? 'border-blue-500 ring-2 ring-blue-100 bg-blue-50/10' 
                : 'border-slate-200'
          }">
            
            <div class="flex items-center justify-between gap-1 mb-1">
              <div class="flex items-center gap-1 flex-1 min-w-0">
                <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${id}')" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer flex-shrink-0">
                <input type="text" value="${sw.name}" onchange="updateName('${id}', this.value)" placeholder="艇名" class="font-bold text-slate-800 text-xs border-b border-transparent hover:border-slate-300 focus:border-blue-500 focus:outline-none w-full bg-transparent px-0.5 py-0.5 truncate">
              </div>

              <button onclick="deleteTimer('${id}')" title="削除" class="text-slate-300 hover:text-rose-500 p-0.5 rounded transition flex-shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>

            <div class="bg-slate-900 text-emerald-400 font-mono font-black text-base sm:text-xl md:text-2xl text-center py-1 px-1 rounded-lg my-1 shadow-inner border border-slate-800 tracking-tighter whitespace-nowrap overflow-hidden">
              <span id="display-${id}">${formatTime(getElapsedTime(sw))}</span>
            </div>

            <div class="grid grid-cols-3 gap-1 my-1.5">
              <button onclick="toggleStartWithSound('${id}')" class="min-h-[30px] rounded font-bold text-white shadow active:scale-95 transition-all text-[10px] flex items-center justify-center ${sw.isRunning ? 'bg-rose-500 hover:bg-rose-600' : 'bg-emerald-600 hover:bg-emerald-700'}">
                ${sw.isRunning ? 'STOP' : 'START'}
              </button>
              
              <button onclick="addLapWithSound('${id}')" ${!sw.isRunning ? 'disabled' : ''} class="min-h-[30px] rounded font-bold bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white shadow active:scale-95 transition-all text-[10px] flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed">
                LAP
              </button>

              <button onclick="resetTimerWithSound('${id}')" ${sw.isRunning ? 'disabled' : ''} class="min-h-[30px] rounded font-bold bg-slate-500 hover:bg-slate-600 text-white shadow active:scale-95 transition-all text-[10px] flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed">
                RESET
              </button>
            </div>

            <div class="border-t border-slate-100 pt-1">
              <div class="flex items-center justify-between bg-slate-900 text-white rounded p-1 shadow-inner gap-1">
                <div id="lapContainer-${id}" class="h-6 overflow-y-auto no-scrollbar scroll-smooth flex-1 font-mono text-[10px] snap-y snap-mandatory">
                  ${laps.length === 0 ? 
                    '<div class="h-6 flex items-center justify-center text-slate-500 font-sans text-[9px]">記録なし</div>' : 
                    laps.slice().reverse().map((lap, idx) => {
                      const lapNum = laps.length - idx;
                      return `
                        <div class="h-6 snap-start flex items-center justify-between px-1 ${lap.type === 'STOP' ? 'bg-rose-950/60 text-rose-300' : 'text-slate-200'}">
                          <span class="font-bold text-[9px] text-slate-400 mr-1">#${lapNum}${lap.type === 'STOP' ? '(STOP)' : ''}</span>
                          <div class="flex items-center gap-1.5 font-black tracking-tight">
                            <span class="text-amber-400">L:${lap.lapTime}</span>
                            <span class="text-slate-600">|</span>
                            <span class="text-blue-400">S:${lap.splitTime}</span>
                          </div>
                        </div>
                      `;
                    }).join('')
                  }
                </div>

                <div class="flex flex-col gap-0.5 flex-shrink-0">
                  <button onclick="scrollLap('${id}', -1)" title="前のLAP" class="w-4 h-2.5 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-300 rounded-xs flex items-center justify-center text-[7px] leading-none transition">
                    ▲
                  </button>
                  <button onclick="scrollLap('${id}', 1)" title="次のLAP" class="w-4 h-2.5 bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-slate-300 rounded-xs flex items-center justify-center text-[7px] leading-none transition">
                    ▼
                  </button>
                </div>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function tick() {
      Object.keys(state.stopwatches).forEach(id => {
        const sw = state.stopwatches[id];
        if (sw && sw.isRunning) {
          const displayEl = document.getElementById(`display-${id}`);
          if (displayEl) {
            displayEl.innerText = formatTime(getElapsedTime(sw));
          }
        }
      });
      requestAnimationFrame(tick);
    }

    window.addEventListener('DOMContentLoaded', () => {
      initP2P();
      renderStructure();
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
