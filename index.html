<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rowing マルチストップウォッチ ver2</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS (P2P同期) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- SheetJS (Excel書き出し) -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <!-- html2canvas (画像キャプチャ) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    button, input, label, select {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10 text-slate-800 antialiased selection:bg-blue-200">

  <!-- 初画面：共有ID入力・入室モーダル -->
  <div id="joinModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 p-6 space-y-5">
      <div class="text-center">
        <h2 class="text-xl font-black text-slate-800 tracking-wide">Rowing マルチストップウォッチ</h2>
        <p class="text-xs text-slate-500 mt-1">半角英数字で共有IDを入力してください</p>
      </div>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">共有ID（任意英数字）</label>
          <input type="text" id="roomInput" placeholder="例: rowing2026" class="w-full px-3 py-2 border border-slate-300 rounded-xl text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button onclick="submitJoin()" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-2.5 rounded-xl shadow-md transition active:scale-[0.98] text-sm">
          入室 / 同期開始
        </button>

        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-2 text-[10px] text-slate-400 font-bold uppercase">OR</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <button onclick="createNewRoom()" class="w-full bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-bold py-2 rounded-xl border border-slate-300 transition text-xs">
          新しい共有IDを自動生成して作成
        </button>
      </div>
    </div>
  </div>

  <div class="max-w-[1600px] mx-auto px-2 pt-2">

    <!-- ヘッダー・操作コントロールバー -->
    <header class="bg-white/95 backdrop-blur-md p-2 rounded-xl shadow-md border border-slate-200/80 mb-2 sticky top-1 z-30">
      
      <!-- 上段：ステータス・共有ID・選択一括操作・艇数 -->
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-1.5 mb-1.5 text-xs">
        <div class="flex items-center gap-2 flex-wrap">
          <!-- 接続ステータス -->
          <span id="statusBadge" class="px-1.5 py-0.5 font-bold rounded-full bg-amber-100 text-amber-800 flex items-center gap-1 text-[10px] border border-amber-300">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="statusText">未接続</span>
          </span>

          <!-- 共有ID -->
          <div class="flex items-center gap-1 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200 text-[10px]">
            <span class="text-slate-500 font-medium">共有ID:</span>
            <span id="roomCodeDisplay" class="font-mono font-bold text-blue-600">-</span>
          </div>

          <!-- 全選択 -->
          <label class="flex items-center gap-1 cursor-pointer font-bold text-slate-700 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 hover:bg-slate-200 transition text-[10px]">
            <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(event)" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
            <span>全選択</span>
          </label>

          <!-- 選択START -->
          <button onclick="batchStartWithSound()" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold px-2 py-0.5 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95 text-[10px]">
            選択START
          </button>

          <!-- 選択STOP -->
          <button onclick="batchStopWithSound()" class="bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white font-bold px-2 py-0.5 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95 text-[10px]">
            選択STOP
          </button>

          <!-- 艇数表示 (最大100) -->
          <div class="font-bold bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-200 text-[10px]">
            艇数: <span id="count" class="text-xs text-blue-800 font-black">0</span> / 100
          </div>
        </div>

        <div class="flex items-center gap-1">
          <button onclick="reopenJoinModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-1.5 py-0.5 rounded text-[10px] transition">
            ID変更
          </button>
          <button onclick="copyShareUrl()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-1.5 py-0.5 rounded text-[10px] transition">
            URLコピー
          </button>
          <button onclick="shareLineUrl()" class="bg-[#06C755] hover:bg-[#05b34c] text-white font-bold px-1.5 py-0.5 rounded text-[10px] transition flex items-center gap-1">
            <span>LINEでURL共有</span>
          </button>
          <button onclick="resetAllTimersWithSound()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-1.5 py-0.5 rounded text-[10px] transition">
            全体リセット
          </button>
        </div>
      </div>

      <!-- 下段：操作・出力ボタン群 -->
      <div class="flex flex-wrap items-center justify-start gap-1 text-[11px]">
        <button onclick="stopAllTimersWithSound()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-2 py-1 rounded shadow-sm">
          全体STOP
        </button>
        <button onclick="addTimer()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-2 py-1 rounded shadow-sm">
          ＋ 追加
        </button>
        <button onclick="removeTimer()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-2 py-1 rounded shadow-sm">
          － 削除
        </button>
        <button onclick="openPreviewModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-2 py-1 rounded shadow-sm">
          データ表示
        </button>
        <button onclick="exportExcel()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-2 py-1 rounded shadow-sm">
          Excel出力
        </button>
      </div>
    </header>

    <!-- 通知トースト -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white px-3.5 py-2 rounded-xl shadow-2xl text-xs font-bold transition-all transform translate-y-20 opacity-0 z-50 border border-slate-700">
      <span id="toastMsg">通知メッセージ</span>
    </div>

    <!-- 結果表示プレビューモーダル -->
    <div id="previewModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-2">
      <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
        <div class="p-3 bg-slate-800 text-white flex items-center justify-between">
          <h3 class="font-bold text-sm">計測データプレビュー (SPLITのみ)</h3>
          <button onclick="closePreviewModal()" class="text-slate-400 hover:text-white p-1">✕</button>
        </div>
        <div class="p-3 overflow-auto flex-1 bg-slate-100 flex justify-center items-start">
          <div id="previewTableContainer" class="inline-block"></div>
        </div>
        <div class="p-2.5 bg-white border-t border-slate-200 flex justify-end items-center text-xs gap-1.5 flex-wrap">
          <button onclick="exportExcel()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-3 py-1.5 rounded flex items-center gap-1">
            Excel保存
          </button>
          <button onclick="sendToLine()" class="bg-[#06C755] hover:bg-[#05b34c] text-white font-bold px-3 py-1.5 rounded flex items-center gap-1 shadow-sm">
            <span>LINE画像転送</span>
          </button>
          <button onclick="closePreviewModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-1.5 rounded">
            閉じる
          </button>
        </div>
      </div>
    </div>

    <!-- ストップウォッチカード一覧 -->
    <main id="app" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2"></main>

  </div>

  <script>
    let state = { stopwatches: {} };
    let selectedIds = new Set();
    let isHost = false;
    let peer = null;
    let hostConn = null;
    let clientConns = [];
    let roomCode = '';
    let hostPeerId = '';

    let lastSyncServerTime = Date.now();
    let lastSyncLocalTime = Date.now();

    // ローカルストレージ読み書き
    function saveStateToStorage() {
      if (!roomCode) return;
      try {
        localStorage.setItem(`rowing_state_${roomCode}`, JSON.stringify(state));
      } catch (e) {
        console.error("Storage save failed:", e);
      }
    }

    function loadStateFromStorage() {
      if (!roomCode) return false;
      try {
        const saved = localStorage.getItem(`rowing_state_${roomCode}`);
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.stopwatches && Object.keys(parsed.stopwatches).length > 0) {
            state = parsed;
            return true;
          }
        }
      } catch (e) {
        console.error("Storage load failed:", e);
      }
      return false;
    }

    // 初期状態として6枚のカードをセットアップ
    function initDefaultStopwatches() {
      state.stopwatches = {};
      const now = Date.now();
      for (let i = 1; i <= 6; i++) {
        const id = 'sw_' + now + '_' + i + '_' + Math.floor(Math.random() * 1000);
        state.stopwatches[id] = {
          id,
          name: `艇 ${i}`,
          isRunning: false,
          startTime: 0,
          accumulatedTime: 0,
          laps: []
        };
      }
      saveStateToStorage();
      renderStructure();
    }

    // 音声処理
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq = 880, type = 'sine', duration = 0.1) {
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function batchStartWithSound() { playBeep(1046.50, 'sine', 0.15); batchStart(); }
    function batchStopWithSound() { playBeep(523.25, 'square', 0.18); batchStop(); }
    function stopAllTimersWithSound() { playBeep(523.25, 'square', 0.18); stopAllTimers(); }
    function toggleStartWithSound(id) {
      const sw = state.stopwatches[id];
      playBeep(sw && sw.isRunning ? 659.25 : 880.00, 'sine', 0.12);
      toggleStart(id);
    }
    function addLapWithSound(id) { playBeep(1318.51, 'sine', 0.08); addLap(id); }
    function resetTimerWithSound(id) {
      const sw = state.stopwatches[id];
      if (!sw || sw.isRunning) return;
      playBeep(440.00, 'triangle', 0.1);
      resetTimer(id);
    }
    function resetAllTimersWithSound() { playBeep(349.23, 'triangle', 0.15); resetAllTimers(); }

    const peerConfig = {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    };

    window.addEventListener('DOMContentLoaded', () => {
      const urlHash = location.hash.replace('#', '').trim();
      if (urlHash) {
        document.getElementById('roomInput').value = urlHash;
      }
    });

    function submitJoin() {
      const code = document.getElementById('roomInput').value.trim().replace(/[^a-zA-Z0-9_-]/g, '');
      if (!code) return alert('共有IDを英数字で入力してください');
      startAppWithRoom(code);
    }

    function createNewRoom() {
      const code = 'rowing' + Math.floor(1000 + Math.random() * 9000);
      document.getElementById('roomInput').value = code;
      startAppWithRoom(code);
    }

    function reopenJoinModal() {
      document.getElementById('joinModal').classList.remove('hidden');
    }

    function cleanupP2P() {
      if (hostConn) {
        try { hostConn.close(); } catch (e) {}
        hostConn = null;
      }
      clientConns.forEach(conn => {
        try { conn.close(); } catch (e) {}
      });
      clientConns = [];
      if (peer) {
        try { peer.destroy(); } catch (e) {}
        peer = null;
      }
      isHost = false;
    }

    function startAppWithRoom(code) {
      roomCode = code;
      location.hash = roomCode;
      document.getElementById('roomCodeDisplay').innerText = roomCode;
      document.getElementById('joinModal').classList.add('hidden');

      cleanupP2P();
      state = { stopwatches: {} };
      selectedIds.clear();

      // ローカルストレージ復元。保存データがない場合は初期6艇を即時作成
      const hasSavedData = loadStateFromStorage();
      if (!hasSavedData || Object.keys(state.stopwatches).length === 0) {
        initDefaultStopwatches();
      } else {
        renderStructure();
      }

      hostPeerId = `rowing-app-room-v24-${roomCode}`;
      
      setTimeout(() => {
        initP2P();
      }, 200);
    }

    function getNow() {
      if (isHost) return Date.now();
      return lastSyncServerTime + (Date.now() - lastSyncLocalTime);
    }

    function initP2P() {
      try {
        peer = new Peer(hostPeerId, peerConfig);
        
        peer.on('open', () => {
          isHost = true;
          updateStatus('ホスト (親機)', 'bg-emerald-100 text-emerald-800 border-emerald-300');
          saveStateToStorage();
        });

        peer.on('disconnected', () => {
          if (peer && !peer.destroyed) peer.reconnect();
        });

        peer.on('connection', (conn) => {
          clientConns = clientConns.filter(c => c && c.open && c.peer !== conn.peer);
          clientConns.push(conn);

          conn.on('open', () => {
            conn.send({ type: 'SYNC_STATE', state, serverTime: Date.now() });
            updateHostStatus();
          });
          conn.on('data', (data) => dispatchAction(data));
          conn.on('close', () => {
            clientConns = clientConns.filter(c => c !== conn && c.open);
            updateHostStatus();
          });
        });

        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            isHost = false;
            if (peer) {
              try { peer.destroy(); } catch(e){}
            }
            peer = new Peer(peerConfig);
            peer.on('open', () => connectToHost());
          } else {
            updateStatus('通信エラー', 'bg-rose-100 text-rose-800 border-rose-300');
          }
        });
      } catch (e) {
        updateStatus('オフライン', 'bg-amber-100 text-amber-800 border-amber-300');
      }
    }

    function connectToHost() {
      updateStatus('ホスト接続中...', 'bg-amber-100 text-amber-800 border-amber-300');
      hostConn = peer.connect(hostPeerId, { reliable: true });

      hostConn.on('open', () => {
        updateStatus('同期中 (子機)', 'bg-blue-100 text-blue-800 border-blue-300');
        hostConn.send({ type: 'REQUEST_SYNC' });
      });

      hostConn.on('data', (data) => {
        if (data.type === 'PING') return;
        if (data.type === 'SYNC_STATE') {
          if (data.serverTime) {
            lastSyncServerTime = data.serverTime;
            lastSyncLocalTime = Date.now();
          }
          state = data.state;
          saveStateToStorage();
          renderStructure();
        }
      });

      hostConn.on('close', () => {
        updateStatus('切断', 'bg-rose-100 text-rose-800 border-rose-300');
        setTimeout(connectToHost, 3000);
      });
    }

    function updateHostStatus() {
      if (isHost) {
        const activePeers = new Set(clientConns.filter(c => c && c.open).map(c => c.peer));
        updateStatus(`ホスト (接続:${activePeers.size}台)`, 'bg-emerald-100 text-emerald-800 border-emerald-300');
      }
    }

    function updateStatus(text, colorClass) {
      const badge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      if (badge && statusText) {
        statusText.innerText = text;
        badge.className = `px-1.5 py-0.5 font-bold rounded-full flex items-center gap-1 border text-[10px] ${colorClass}`;
      }
    }

    function dispatchAction(action) {
      if (action.type === 'PING') return;
      if (action.type === 'REQUEST_SYNC' && isHost) {
        broadcastState();
        return;
      }

      if (isHost) {
        handleAction(action);
        saveStateToStorage();
        broadcastState();
      } else if (hostConn && hostConn.open) {
        hostConn.send(action);
      } else {
        handleAction(action);
        saveStateToStorage();
      }
    }

    function handleAction(action) {
      const now = getNow();
      const keys = Object.keys(state.stopwatches);

      switch (action.type) {
        case 'ADD':
          if (keys.length >= 100) return alert("最大100艇まで追加可能です");
          const id = 'sw_' + now + '_' + Math.floor(Math.random() * 1000);
          state.stopwatches[id] = {
            id,
            name: `艇 ${keys.length + 1}`,
            isRunning: false,
            startTime: 0,
            accumulatedTime: 0,
            laps: []
          };
          break;

        case 'DELETE':
          delete state.stopwatches[action.id];
          selectedIds.delete(action.id);
          break;

        case 'DELETE_SELECTED':
          selectedIds.forEach(swId => delete state.stopwatches[swId]);
          selectedIds.clear();
          break;

        case 'REMOVE_LAST':
          if (keys.length > 0) {
            const lastId = keys[keys.length - 1];
            delete state.stopwatches[lastId];
            selectedIds.delete(lastId);
          }
          break;

        case 'RESET':
          if (state.stopwatches[action.id] && !state.stopwatches[action.id].isRunning) {
            state.stopwatches[action.id].startTime = 0;
            state.stopwatches[action.id].accumulatedTime = 0;
            state.stopwatches[action.id].laps = [];
          }
          break;

        case 'RESET_ALL':
          Object.keys(state.stopwatches).forEach(swId => {
            const sw = state.stopwatches[swId];
            if (sw && !sw.isRunning) {
              sw.startTime = 0;
              sw.accumulatedTime = 0;
              sw.laps = [];
            }
          });
          break;

        case 'STOP_ALL':
          Object.keys(state.stopwatches).forEach(swId => {
            const sw = state.stopwatches[swId];
            if (sw && sw.isRunning) {
              const currentSplit = sw.accumulatedTime + (now - sw.startTime);
              const laps = sw.laps || [];
              const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
              const lapDuration = currentSplit - lastSplit;

              laps.push({
                lapTime: formatTime(lapDuration),
                splitTime: formatTime(currentSplit),
                rawSplit: currentSplit,
                timestamp: now,
                type: 'STOP'
              });

              sw.accumulatedTime = currentSplit;
              sw.isRunning = false;
              sw.startTime = 0;
              sw.laps = laps;
            }
          });
          break;

        case 'TOGGLE_START':
          const sw = state.stopwatches[action.id];
          if (sw) {
            if (sw.isRunning) {
              const currentSplit = sw.accumulatedTime + (now - sw.startTime);
              const laps = sw.laps || [];
              const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
              const lapDuration = currentSplit - lastSplit;

              laps.push({
                lapTime: formatTime(lapDuration),
                splitTime: formatTime(currentSplit),
                rawSplit: currentSplit,
                timestamp: now,
                type: 'STOP'
              });

              sw.accumulatedTime = currentSplit;
              sw.isRunning = false;
              sw.startTime = 0;
              sw.laps = laps;
            } else {
              sw.isRunning = true;
              sw.startTime = now;
            }
          }
          break;

        case 'ADD_LAP':
          const swLap = state.stopwatches[action.id];
          if (swLap && swLap.isRunning) {
            const currentSplit = swLap.accumulatedTime + (now - swLap.startTime);
            const laps = swLap.laps || [];
            const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
            const lapDuration = currentSplit - lastSplit;

            laps.push({
              lapTime: formatTime(lapDuration),
              splitTime: formatTime(currentSplit),
              rawSplit: currentSplit,
              timestamp: now,
              type: 'LAP'
            });
            swLap.laps = laps;
          }
          break;

        case 'UPDATE_NAME':
          if (state.stopwatches[action.id]) {
            state.stopwatches[action.id].name = action.name;
          }
          break;

        case 'BATCH_START':
          (action.ids || []).forEach(swId => {
            const target = state.stopwatches[swId];
            if (target && !target.isRunning) {
              target.isRunning = true;
              target.startTime = now;
            }
          });
          break;

        case 'BATCH_STOP':
          (action.ids || []).forEach(swId => {
            const target = state.stopwatches[swId];
            if (target && target.isRunning) {
              const currentSplit = target.accumulatedTime + (now - target.startTime);
              const laps = target.laps || [];
              const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
              const lapDuration = currentSplit - lastSplit;

              laps.push({
                lapTime: formatTime(lapDuration),
                splitTime: formatTime(currentSplit),
                rawSplit: currentSplit,
                timestamp: now,
                type: 'STOP'
              });

              target.accumulatedTime = currentSplit;
              target.isRunning = false;
              target.startTime = 0;
              target.laps = laps;
            }
          });
          break;
      }

      renderStructure();
    }

    function broadcastState() {
      const payload = { type: 'SYNC_STATE', state, serverTime: Date.now() };
      clientConns.forEach(conn => {
        if (conn && conn.open) conn.send(payload);
      });
    }

    window.addTimer = () => dispatchAction({ type: 'ADD' });
    window.deleteTimer = (id) => dispatchAction({ type: 'DELETE', id });
    window.removeTimer = () => {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("削除する艇がありません");
      if (selectedIds.size > 0) {
        if (confirm(`選択中の ${selectedIds.size} 艇を削除しますか？`)) dispatchAction({ type: 'DELETE_SELECTED' });
      } else {
        dispatchAction({ type: 'REMOVE_LAST' });
      }
    };
    window.resetTimer = (id) => dispatchAction({ type: 'RESET', id });
    window.stopAllTimers = () => dispatchAction({ type: 'STOP_ALL' });
    window.resetAllTimers = () => {
      if (confirm("停止中のストップウォッチをリセットしますか？")) dispatchAction({ type: 'RESET_ALL' });
    };
    window.toggleStart = (id) => dispatchAction({ type: 'TOGGLE_START', id });
    window.addLap = (id) => dispatchAction({ type: 'ADD_LAP', id });
    window.updateName = (id, name) => dispatchAction({ type: 'UPDATE_NAME', id, name });
    window.batchStart = () => {
      if (selectedIds.size === 0) return alert("対象艇を選択してください");
      dispatchAction({ type: 'BATCH_START', ids: Array.from(selectedIds) });
    };
    window.batchStop = () => {
      if (selectedIds.size === 0) return alert("対象艇を選択してください");
      dispatchAction({ type: 'BATCH_STOP', ids: Array.from(selectedIds) });
    };

    // mm:ss.00 フォーマット
    function formatTime(ms) {
      if (!ms || ms < 0) ms = 0;
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const h = Math.floor((ms % 1000) / 10);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(h).padStart(2, '0')}`;
    }

    function getElapsedTime(sw) {
      if (!sw) return 0;
      let elapsed = sw.accumulatedTime || 0;
      if (sw.isRunning && sw.startTime) {
        elapsed += (getNow() - sw.startTime);
      }
      return Math.max(0, elapsed);
    }

    function getDefaultFileName(ext) {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `Result_${yyyy}${mm}${dd}_${hh}${min}.${ext}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.toggleSelect = (id) => {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      renderStructure();
    };

    window.toggleSelectAll = (e) => {
      const keys = Object.keys(state.stopwatches);
      if (e.target.checked) keys.forEach(id => selectedIds.add(id));
      else selectedIds.clear();
      renderStructure();
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    window.copyShareUrl = () => {
      const shareUrl = `${location.origin}${location.pathname}#${roomCode}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast("共有URLをコピーしました！");
      }).catch(() => {
        prompt("共有URL:", shareUrl);
      });
    };

    window.shareLineUrl = () => {
      if (location.protocol === 'file:') {
        alert("ローカルファイル(file://)からはLINE共有できません。\nWebサーバー(https://)に保存するか、URLコピーボタンで共有IDをコピーして送信してください。");
        return;
      }
      const shareUrl = `${location.origin}${location.pathname}#${roomCode}`;
      const lineUrl = `https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(shareUrl)}`;
      window.open(lineUrl, '_blank');
    };

    // 出力・プレビューデータ生成（SPLITのみ）
    function generateExportData() {
      let maxLaps = 0;
      Object.values(state.stopwatches).forEach(sw => {
        const lCount = (sw.laps || []).length;
        if (lCount > maxLaps) maxLaps = lCount;
      });

      const header = ['艇名', '項目'];
      for (let i = 1; i <= maxLaps; i++) {
        header.push(`P${i}`);
      }
      const aoa = [header];

      Object.values(state.stopwatches).forEach(sw => {
        const laps = sw.laps || [];
        const splitRow = [sw.name, 'SPLIT'];

        if (laps.length === 0) {
          const cur = formatTime(getElapsedTime(sw));
          splitRow.push(cur);
        } else {
          laps.forEach(lap => {
            splitRow.push(lap.splitTime);
          });
        }
        aoa.push(splitRow);
      });

      return aoa;
    }

    function createOptimizedWorksheet(aoa) {
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      if (aoa.length > 0) {
        const colWidths = aoa[0].map((_, colIdx) => {
          let maxLen = 0;
          aoa.forEach(row => {
            const val = row[colIdx] ? String(row[colIdx]) : '';
            if (val.length > maxLen) maxLen = val.length;
          });
          return { wch: Math.max(maxLen + 2, 6) };
        });
        ws['!cols'] = colWidths;
      }
      return ws;
    }

    window.exportExcel = () => {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("出力するデータがありません");
      const aoa = generateExportData();
      const ws = createOptimizedWorksheet(aoa);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Result");
      XLSX.writeFile(wb, getDefaultFileName('xlsx'));
    };

    // プレビュー表示用HTML生成（html2canvasで文字が下寄せにならないよう明確な中央揃えスタイルを付与）
    function renderPreviewTableHtml() {
      const aoa = generateExportData();
      let tableHtml = `<div id="captureTarget" style="background-color: #ffffff; color: #000000; padding: 16px; border-radius: 8px; border: 1px solid #cbd5e1; display: inline-block;">`;
      tableHtml += `<h2 style="font-size: 14px; font-weight: bold; color: #0f172a; margin-bottom: 10px; font-family: sans-serif; text-align: left;">Rowing 計測結果表 (${new Date().toLocaleString('ja-JP')})</h2>`;
      tableHtml += `<table style="border-collapse: collapse; font-size: 11px; text-align: center; background-color: #ffffff; font-family: sans-serif; table-layout: auto;"><thead><tr style="background-color: #e2e8f0; font-weight: bold;">`;
      aoa[0].forEach(col => {
        tableHtml += `<th style="padding: 0 12px; border: 1px solid #cbd5e1; color: #0f172a; white-space: nowrap; vertical-align: middle; height: 32px; box-sizing: border-box; line-height: 1.2;">${col}</th>`;
      });
      tableHtml += `</tr></thead><tbody>`;

      for (let i = 1; i < aoa.length; i++) {
        const row = aoa[i];
        const bgColor = i % 2 === 0 ? '#f8fafc' : '#ffffff';
        tableHtml += `<tr style="background-color: ${bgColor};">`;
        row.forEach((cell, cellIdx) => {
          const fontStyle = cellIdx >= 2 ? 'font-family: monospace; font-weight: bold;' : 'font-weight: bold;';
          const alignStyle = cellIdx === 0 ? 'text-align: left;' : 'text-align: center;';
          tableHtml += `<td style="padding: 0 12px; border: 1px solid #cbd5e1; color: #0f172a; white-space: nowrap; vertical-align: middle; height: 32px; box-sizing: border-box; line-height: 1.2; ${alignStyle} ${fontStyle}">${cell || ''}</td>`;
        });
        tableHtml += `</tr>`;
      }
      tableHtml += `</tbody></table></div>`;
      return tableHtml;
    }

    window.openPreviewModal = () => {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("表示するデータがありません");
      const container = document.getElementById('previewTableContainer');
      container.innerHTML = renderPreviewTableHtml();
      document.getElementById('previewModal').classList.remove('hidden');
    };

    window.closePreviewModal = () => {
      document.getElementById('previewModal').classList.add('hidden');
    };

    window.sendToLine = async () => {
      const target = document.getElementById('captureTarget');
      if (!target) return alert("表示するデータがありません");

      showToast("画像を生成中...");

      try {
        const canvas = await html2canvas(target, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false
        });

        canvas.toBlob(async (blob) => {
          if (!blob) return alert("画像の生成に失敗しました");

          const file = new File([blob], `RowingResult_${Date.now()}.png`, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                title: 'Rowing 計測結果',
                text: '計測結果画像',
                files: [file]
              });
              return;
            } catch (err) {
              if (err.name !== 'AbortError') console.error(err);
            }
          }

          const link = document.createElement('a');
          link.download = `RowingResult_${Date.now()}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();

          showToast("画像を保存しました。LINEに貼り付けて共有してください。");
        }, 'image/png');

      } catch (e) {
        console.error(e);
        alert("画像生成処理でエラーが発生しました。");
      }
    };

    // 画面構造・カード描画
    function renderStructure() {
      const app = document.getElementById('app');
      const countEl = document.getElementById('count');
      const keys = Object.keys(state.stopwatches);
      
      if (countEl) countEl.innerText = keys.length;

      // 存在しない不要なカードの削除
      app.querySelectorAll('[data-id]').forEach(card => {
        const id = card.getAttribute('data-id');
        if (!state.stopwatches[id]) card.remove();
      });

      // 各ストップウォッチカードの構築および更新
      keys.forEach(id => {
        const sw = state.stopwatches[id];
        let card = app.querySelector(`[data-id="${id}"]`);
        if (!card) {
          card = document.createElement('div');
          card.setAttribute('data-id', id);
          app.appendChild(card);
        }

        const isSelected = selectedIds.has(id);
        const laps = sw.laps || [];
        const pNumText = laps.length > 0 ? `P${laps.length}` : 'P0';
        const lastLap = laps.length > 0 ? laps[laps.length - 1].lapTime : '00:00.00';
        const lastSplit = laps.length > 0 ? laps[laps.length - 1].splitTime : '00:00.00';

        card.className = `bg-white rounded-xl shadow-sm border ${
          isSelected ? 'border-blue-500 ring-2 ring-blue-200' : 'border-slate-200'
        } p-2 flex flex-col justify-between relative transition-all`;

        card.innerHTML = `
          <div class="flex items-center justify-between gap-1 mb-1">
            <div class="flex items-center gap-1 flex-1 min-w-0">
              <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${id}')" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 flex-shrink-0 cursor-pointer">
              <input type="text" value="${escapeHtml(sw.name)}" onchange="updateName('${id}', this.value)" class="w-full font-bold px-1.5 py-0.5 border border-slate-200 rounded text-xs focus:outline-none focus:border-blue-500 bg-slate-50">
            </div>
            <button onclick="deleteTimer('${id}')" title="削除" class="text-slate-400 hover:text-rose-600 px-1 text-xs transition">✕</button>
          </div>

          <div class="text-center py-1 bg-slate-900 text-emerald-400 font-mono text-xl font-bold rounded-lg my-1 shadow-inner tracking-wider" id="time_${id}">
            ${formatTime(getElapsedTime(sw))}
          </div>

          <!-- P地点番号・LAP/SPLIT表示領域 -->
          <div class="bg-slate-50 rounded p-1 my-1 border border-slate-100 text-[10px] font-mono flex items-center gap-1.5 text-slate-600">
            <span id="pnum_${id}" class="font-black text-blue-700 bg-blue-100 px-1.5 py-0.5 rounded text-[10px] shrink-0 leading-none">
              ${pNumText}
            </span>
            <div class="flex-1 grid grid-cols-2 gap-1 min-w-0">
              <div class="truncate">LAP: <span id="lap_${id}" class="font-bold text-slate-800">${lastLap}</span></div>
              <div class="truncate">SPLIT: <span id="split_${id}" class="font-bold text-slate-800">${lastSplit}</span></div>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-1 mt-1">
            <button onclick="toggleStartWithSound('${id}')" class="py-1.5 px-0.5 font-bold rounded-lg text-[10px] sm:text-xs text-white shadow-sm transition active:scale-95 ${
              sw.isRunning ? 'bg-rose-500 hover:bg-rose-600' : 'bg-emerald-600 hover:bg-emerald-700'
            }">
              ${sw.isRunning ? 'STOP' : 'START'}
            </button>
            <button onclick="addLapWithSound('${id}')" ${!sw.isRunning ? 'disabled' : ''} class="py-1.5 px-0.5 font-bold rounded-lg text-[10px] sm:text-xs text-white bg-orange-500 hover:bg-orange-600 shadow-sm transition active:scale-95 ${
              !sw.isRunning ? 'opacity-50 cursor-not-allowed' : ''
            }">
              LAP
            </button>
            <button onclick="resetTimerWithSound('${id}')" ${sw.isRunning ? 'disabled' : ''} class="py-1.5 px-0.5 font-bold rounded-lg text-[10px] sm:text-xs text-amber-800 bg-amber-100 hover:bg-amber-200 shadow-sm transition active:scale-95 ${
              sw.isRunning ? 'opacity-50 cursor-not-allowed' : ''
            }">
              RESET
            </button>
          </div>
        `;
      });
    }

    // 画面のリアルタイム表示更新（ミリ秒描画）
    function updateDisplayLoop() {
      Object.keys(state.stopwatches).forEach(id => {
        const sw = state.stopwatches[id];
        if (!sw) return;

        const timeEl = document.getElementById(`time_${id}`);
        if (timeEl) {
          timeEl.innerText = formatTime(getElapsedTime(sw));
        }

        const pnumEl = document.getElementById(`pnum_${id}`);
        const lapEl = document.getElementById(`lap_${id}`);
        const splitEl = document.getElementById(`split_${id}`);
        const laps = sw.laps || [];

        if (pnumEl) {
          pnumEl.innerText = laps.length > 0 ? `P${laps.length}` : 'P0';
        }

        if (laps.length > 0) {
          const last = laps[laps.length - 1];
          if (lapEl) lapEl.innerText = last.lapTime;
          if (splitEl) splitEl.innerText = last.splitTime;
        } else {
          if (lapEl) lapEl.innerText = '00:00.00';
          if (splitEl) splitEl.innerText = '00:00.00';
        }
      });
      requestAnimationFrame(updateDisplayLoop);
    }

    // 更新ループスタート
    requestAnimationFrame(updateDisplayLoop);
  </script>
</body>
</html>
