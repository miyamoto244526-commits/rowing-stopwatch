<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rowing マルチストップウォッチ ver2 (スマホ対応版)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS for P2P Realtime Sync -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- SheetJS for Excel & CSV Export -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    button, input, label, select {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10 text-slate-800 antialiased selection:bg-blue-200">

  <div class="max-w-[1600px] mx-auto px-2 pt-2">

    <!-- ヘッダー・操作コントロールバー -->
    <header class="bg-white/95 backdrop-blur-md p-2 rounded-xl shadow-md border border-slate-200/80 mb-3 sticky top-1 z-30">
      
      <!-- 上段：ステータス・共有ID・全選択・選択START・選択STOP・艇数・補助操作 -->
      <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-1.5 mb-1.5 text-xs">
        <div class="flex items-center gap-1.5 flex-wrap">
          <!-- 接続ステータス -->
          <span id="statusBadge" class="px-2 py-0.5 font-bold rounded-full bg-amber-100 text-amber-800 flex items-center gap-1 text-[10px] border border-amber-300">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="statusText">接続準備中...</span>
          </span>

          <!-- 共有ID -->
          <div class="flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 text-[10px]">
            <span class="text-slate-500 font-medium">共有ID:</span>
            <span id="roomCodeDisplay" class="font-mono font-bold text-blue-600"></span>
          </div>

          <!-- 全選択 -->
          <label class="flex items-center gap-1 cursor-pointer font-bold text-slate-700 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 hover:bg-slate-200 transition text-[10px]">
            <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(event)" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
            <span>全選択</span>
          </label>

          <!-- 選択START -->
          <button onclick="batchStartWithSound()" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold px-2 py-0.5 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95 text-[10px]">
            選択START
          </button>

          <!-- 選択STOP -->
          <button onclick="batchStopWithSound()" class="bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white font-bold px-2 py-0.5 rounded shadow-sm flex items-center gap-0.5 transition active:scale-95 text-[10px]">
            選択STOP
          </button>

          <!-- 艇数表示 (最大100) -->
          <div class="font-bold bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-200 text-[10px]">
            艇数: <span id="count" class="text-xs text-blue-800 font-black">0</span> / 100
          </div>
        </div>

        <div class="flex items-center gap-1">
          <button onclick="copyShareUrl()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-bold px-1.5 py-0.5 rounded text-[10px] transition active:scale-95">
            URLコピー
          </button>
          <button onclick="resetAllTimersWithSound()" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-700 font-bold px-1.5 py-0.5 rounded text-[10px] transition active:scale-95">
            全体リセット
          </button>
        </div>
      </div>

      <!-- 下段：メイン操作ボタン群 -->
      <div class="flex flex-wrap items-center justify-start gap-1 text-[11px]">
        <button onclick="stopAllTimersWithSound()" class="bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white font-bold px-2.5 py-1 rounded shadow-sm transition active:scale-95">
          全体STOP
        </button>
        <button onclick="addTimer()" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold px-2.5 py-1 rounded shadow-sm transition active:scale-95">
          +追加
        </button>
        <button onclick="removeTimer()" class="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold px-2.5 py-1 rounded shadow-sm transition active:scale-95">
          -削除
        </button>
        <button onclick="openPreviewModal()" class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold px-2.5 py-1 rounded shadow-sm transition active:scale-95">
          データ表示
        </button>
        <button onclick="exportExcel()" class="bg-emerald-700 hover:bg-emerald-800 active:bg-emerald-900 text-white font-bold px-2.5 py-1 rounded shadow-sm transition active:scale-95">
          Excel出力
        </button>
        <button onclick="exportCsv()" class="bg-teal-600 hover:bg-teal-700 active:bg-teal-800 text-white font-bold px-2.5 py-1 rounded shadow-sm transition active:scale-95">
          CSV出力
        </button>
        <button onclick="shareLine()" class="bg-[#06C755] hover:bg-[#05b34c] active:bg-[#049b42] text-white font-bold px-2.5 py-1 rounded shadow-sm transition active:scale-95">
          LINE転送
        </button>
      </div>
    </header>

    <!-- 通知トースト -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white px-3.5 py-2 rounded-xl shadow-2xl text-xs font-bold transition-all transform translate-y-20 opacity-0 z-50 flex items-center gap-2 border border-slate-700">
      <span id="toastMsg">通知メッセージ</span>
    </div>

    <!-- 結果表示モーダル -->
    <div id="previewModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4">
      <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden">
        <div class="p-3 bg-slate-800 text-white flex items-center justify-between">
          <h3 class="font-bold text-sm">計測データプレビュー (SPLITのみ)</h3>
          <button onclick="closePreviewModal()" class="text-slate-400 hover:text-white text-lg font-bold px-2">✕</button>
        </div>
        <div class="p-3 overflow-auto flex-1 bg-slate-50">
          <div id="previewTableContainer" class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-x-auto"></div>
        </div>
        <div class="p-2.5 bg-white border-t border-slate-200 flex flex-wrap items-center justify-between gap-2 text-xs">
          <button onclick="copyTableToClipboard()" class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg shadow-sm">
            クリップボードにコピー
          </button>
          <div class="flex items-center gap-1.5">
            <button onclick="exportExcel()" class="bg-emerald-700 text-white font-bold px-2.5 py-1.5 rounded-lg shadow-sm">Excel保存</button>
            <button onclick="closePreviewModal()" class="bg-slate-200 text-slate-700 font-bold px-3 py-1.5 rounded-lg">閉じる</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ストップウォッチカード一覧（スマホ1〜2列、タブレット/PCで多列化） -->
    <main id="app" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-2.5"></main>

  </div>

  <script>
    let state = { stopwatches: {} };
    let selectedIds = new Set();
    let isHost = false;
    let peer = null;
    let hostConn = null;
    let clientConns = [];

    let lastSyncServerTime = Date.now();
    let lastSyncLocalTime = Date.now();

    // 画面スリープ防止 (Wake Lock)
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock request failed:', err);
      }
    }

    // 効果音生成
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep(freq = 880, type = 'sine', duration = 0.1) {
      try {
        initAudio();
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.warn('Audio error:', e);
      }
    }

    function batchStartWithSound() { playBeep(1046.50, 'sine', 0.15); batchStart(); }
    function batchStopWithSound() { playBeep(523.25, 'square', 0.18); batchStop(); }
    function stopAllTimersWithSound() { playBeep(523.25, 'square', 0.18); stopAllTimers(); }
    function toggleStartWithSound(id) {
      const sw = state.stopwatches[id];
      playBeep(sw && sw.isRunning ? 659.25 : 880.00, 'sine', 0.12);
      toggleStart(id);
    }
    function addLapWithSound(id) { playBeep(1318.51, 'sine', 0.08); addLap(id); }
    function resetTimerWithSound(id) {
      const sw = state.stopwatches[id];
      if (!sw || sw.isRunning) return;
      playBeep(440.00, 'triangle', 0.1);
      resetTimer(id);
    }
    function resetAllTimersWithSound() { playBeep(349.23, 'triangle', 0.15); resetAllTimers(); }

    // ルームID設定
    let roomCode = location.hash.replace('#', '');
    if (!roomCode) {
      roomCode = 'rowing-' + Math.floor(1000 + Math.random() * 9000);
      location.hash = roomCode;
    }
    document.getElementById('roomCodeDisplay').innerText = roomCode;
    const hostPeerId = `rowing-app-room-v21-${roomCode}`;

    function getNow() {
      if (isHost) return Date.now();
      return lastSyncServerTime + (Date.now() - lastSyncLocalTime);
    }

    // P2P初期化（スマホでの接続失敗時も単体動作するようにガード）
    function initP2P() {
      if (typeof Peer === 'undefined') {
        updateStatus('単体動作モード', 'bg-slate-200 text-slate-700 border-slate-300');
        return;
      }

      try {
        peer = new Peer(hostPeerId, {
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });
        
        peer.on('open', () => {
          isHost = true;
          updateStatus('ホスト (親機)', 'bg-emerald-100 text-emerald-800 border-emerald-300');
        });

        peer.on('connection', (conn) => {
          clientConns = clientConns.filter(c => c && c.open && c.peer !== conn.peer);
          clientConns.push(conn);
          conn.on('open', () => {
            conn.send({ type: 'SYNC_STATE', state, serverTime: Date.now() });
            updateHostStatus();
          });
          conn.on('data', (data) => dispatchAction(data));
          conn.on('close', () => { updateHostStatus(); });
        });

        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            isHost = false;
            peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
            peer.on('open', () => connectToHost());
          } else {
            updateStatus('単体動作モード', 'bg-slate-200 text-slate-700 border-slate-300');
          }
        });
      } catch (e) {
        updateStatus('単体動作モード', 'bg-slate-200 text-slate-700 border-slate-300');
      }
    }

    function connectToHost() {
      if (!peer) return;
      updateStatus('接続中...', 'bg-amber-100 text-amber-800 border-amber-300');
      hostConn = peer.connect(hostPeerId, { reliable: true });

      hostConn.on('open', () => {
        updateStatus('同期中 (子機)', 'bg-blue-100 text-blue-800 border-blue-300');
        hostConn.send({ type: 'REQUEST_SYNC' });
      });

      hostConn.on('data', (data) => {
        if (data.type === 'SYNC_STATE') {
          if (data.serverTime) {
            lastSyncServerTime = data.serverTime;
            lastSyncLocalTime = Date.now();
          }
          state = data.state;
          renderStructure();
        }
      });

      hostConn.on('error', () => {
        updateStatus('単体動作モード', 'bg-slate-200 text-slate-700 border-slate-300');
      });
    }

    function updateHostStatus() {
      if (isHost) {
        const activePeers = new Set(clientConns.filter(c => c && c.open).map(c => c.peer));
        updateStatus(`ホスト (${activePeers.size}台接続)`, 'bg-emerald-100 text-emerald-800 border-emerald-300');
      }
    }

    function updateStatus(text, colorClass) {
      const badge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      if (badge && statusText) {
        statusText.innerText = text;
        badge.className = `px-2 py-0.5 font-bold rounded-full flex items-center gap-1 border text-[10px] ${colorClass}`;
      }
    }

    function dispatchAction(action) {
      if (isHost || !hostConn || !hostConn.open) {
        handleAction(action);
        if (isHost) broadcastState();
      } else if (hostConn && hostConn.open) {
        hostConn.send(action);
      }
    }

    function handleAction(action) {
      const now = getNow();
      const keys = Object.keys(state.stopwatches);

      switch (action.type) {
        case 'ADD':
          if (keys.length >= 100) return alert("最大100艇まで追加可能です");
          const id = 'sw_' + now + '_' + Math.floor(Math.random() * 1000);
          state.stopwatches[id] = {
            id,
            name: `艇 ${keys.length + 1}`,
            isRunning: false,
            startTime: 0,
            accumulatedTime: 0,
            laps: []
          };
          break;

        case 'DELETE':
          delete state.stopwatches[action.id];
          selectedIds.delete(action.id);
          break;

        case 'DELETE_SELECTED':
          selectedIds.forEach(swId => delete state.stopwatches[swId]);
          selectedIds.clear();
          break;

        case 'REMOVE_LAST':
          if (keys.length > 0) {
            const lastId = keys[keys.length - 1];
            delete state.stopwatches[lastId];
            selectedIds.delete(lastId);
          }
          break;

        case 'RESET':
          if (state.stopwatches[action.id] && !state.stopwatches[action.id].isRunning) {
            state.stopwatches[action.id].startTime = 0;
            state.stopwatches[action.id].accumulatedTime = 0;
            state.stopwatches[action.id].laps = [];
          }
          break;

        case 'RESET_ALL':
          Object.keys(state.stopwatches).forEach(swId => {
            const sw = state.stopwatches[swId];
            if (sw && !sw.isRunning) {
              sw.startTime = 0;
              sw.accumulatedTime = 0;
              sw.laps = [];
            }
          });
          break;

        case 'STOP_ALL':
          Object.keys(state.stopwatches).forEach(swId => {
            const sw = state.stopwatches[swId];
            if (sw && sw.isRunning) {
              const currentSplit = sw.accumulatedTime + (now - sw.startTime);
              const laps = sw.laps || [];
              const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
              const lapDuration = currentSplit - lastSplit;

              laps.push({
                lapTime: formatTime(lapDuration),
                splitTime: formatTime(currentSplit),
                rawSplit: currentSplit
              });

              sw.accumulatedTime = currentSplit;
              sw.isRunning = false;
              sw.startTime = 0;
              sw.laps = laps;
            }
          });
          break;

        case 'TOGGLE_START':
          const sw = state.stopwatches[action.id];
          if (sw) {
            if (sw.isRunning) {
              const currentSplit = sw.accumulatedTime + (now - sw.startTime);
              const laps = sw.laps || [];
              const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
              const lapDuration = currentSplit - lastSplit;

              laps.push({
                lapTime: formatTime(lapDuration),
                splitTime: formatTime(currentSplit),
                rawSplit: currentSplit
              });

              sw.accumulatedTime = currentSplit;
              sw.isRunning = false;
              sw.startTime = 0;
              sw.laps = laps;
            } else {
              sw.isRunning = true;
              sw.startTime = now;
            }
          }
          break;

        case 'ADD_LAP':
          const swLap = state.stopwatches[action.id];
          if (swLap && swLap.isRunning) {
            const currentSplit = swLap.accumulatedTime + (now - swLap.startTime);
            const laps = swLap.laps || [];
            const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
            const lapDuration = currentSplit - lastSplit;

            laps.push({
              lapTime: formatTime(lapDuration),
              splitTime: formatTime(currentSplit),
              rawSplit: currentSplit
            });
            swLap.laps = laps;
          }
          break;

        case 'UPDATE_NAME':
          if (state.stopwatches[action.id]) {
            state.stopwatches[action.id].name = action.name;
          }
          break;

        case 'BATCH_START':
          (action.ids || []).forEach(swId => {
            const target = state.stopwatches[swId];
            if (target && !target.isRunning) {
              target.isRunning = true;
              target.startTime = now;
            }
          });
          break;

        case 'BATCH_STOP':
          (action.ids || []).forEach(swId => {
            const target = state.stopwatches[swId];
            if (target && target.isRunning) {
              const currentSplit = target.accumulatedTime + (now - target.startTime);
              const laps = target.laps || [];
              const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
              const lapDuration = currentSplit - lastSplit;

              laps.push({
                lapTime: formatTime(lapDuration),
                splitTime: formatTime(currentSplit),
                rawSplit: currentSplit
              });

              target.accumulatedTime = currentSplit;
              target.isRunning = false;
              target.startTime = 0;
              target.laps = laps;
            }
          });
          break;
      }

      renderStructure();
    }

    function broadcastState() {
      const payload = { type: 'SYNC_STATE', state, serverTime: Date.now() };
      clientConns.forEach(conn => {
        if (conn && conn.open) conn.send(payload);
      });
    }

    window.addTimer = () => dispatchAction({ type: 'ADD' });
    window.deleteTimer = (id) => dispatchAction({ type: 'DELETE', id });
    window.removeTimer = () => {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("削除する艇がありません");
      if (selectedIds.size > 0) {
        if (confirm(`選択中の ${selectedIds.size} 艇を削除しますか？`)) dispatchAction({ type: 'DELETE_SELECTED' });
      } else {
        dispatchAction({ type: 'REMOVE_LAST' });
      }
    };
    window.resetTimer = (id) => dispatchAction({ type: 'RESET', id });
    window.stopAllTimers = () => dispatchAction({ type: 'STOP_ALL' });
    window.resetAllTimers = () => {
      if (confirm("停止中のストップウォッチをリセットしますか？")) dispatchAction({ type: 'RESET_ALL' });
    };
    window.toggleStart = (id) => dispatchAction({ type: 'TOGGLE_START', id });
    window.addLap = (id) => dispatchAction({ type: 'ADD_LAP', id });
    window.updateName = (id, name) => dispatchAction({ type: 'UPDATE_NAME', id, name });
    window.batchStart = () => {
      if (selectedIds.size === 0) return alert("対象艇にチェックを入れて選択してください");
      dispatchAction({ type: 'BATCH_START', ids: Array.from(selectedIds) });
    };
    window.batchStop = () => {
      if (selectedIds.size === 0) return alert("対象艇にチェックを入れて選択してください");
      dispatchAction({ type: 'BATCH_STOP', ids: Array.from(selectedIds) });
    };

    function formatTime(ms) {
      if (!ms || ms < 0) ms = 0;
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const h = Math.floor((ms % 1000) / 10);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(h).padStart(2, '0')}`;
    }

    function getElapsedTime(sw) {
      if (!sw) return 0;
      let elapsed = sw.accumulatedTime || 0;
      if (sw.isRunning && sw.startTime) {
        elapsed += (getNow() - sw.startTime);
      }
      return Math.max(0, elapsed);
    }

    function getDefaultFileName(ext) {
      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      return `Result_${yyyy}${mm}${dd}_${hh}${min}.${ext}`;
    }

    window.toggleSelect = (id) => {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      renderStructure();
    };

    window.toggleSelectAll = (e) => {
      const keys = Object.keys(state.stopwatches);
      if (e.target.checked) keys.forEach(id => selectedIds.add(id));
      else selectedIds.clear();
      renderStructure();
    };

    window.showToast = (msg) => {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (toast && toastMsg) {
        toastMsg.innerText = msg;
        toast.classList.remove('translate-y-20', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
        setTimeout(() => {
          toast.classList.remove('translate-y-0', 'opacity-100');
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 2500);
      }
    };

    window.copyShareUrl = () => {
      const shareUrl = `${location.origin}${location.pathname}#${roomCode}`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareUrl).then(() => showToast('共有URLをコピーしました！'));
      } else {
        alert(`共有URL: ${shareUrl}`);
      }
    };

    window.shareLine = () => {
      const shareUrl = `${location.origin}${location.pathname}#${roomCode}`;
      const msg = `【Rowingマルチストップウォッチ】\nリアルタイム計測(ID: ${roomCode})：\n${shareUrl}`;
      window.open(`https://line.me/R/msg/text/?${encodeURIComponent(msg)}`, '_blank');
    };

    function generateExportData() {
      let maxLaps = 0;
      Object.values(state.stopwatches).forEach(sw => {
        const lCount = (sw.laps || []).length;
        if (lCount > maxLaps) maxLaps = lCount;
      });

      const header = ['艇名', '種別'];
      for (let i = 1; i <= maxLaps; i++) header.push(`P${i}`);
      const aoa = [header];

      Object.values(state.stopwatches).forEach(sw => {
        const laps = sw.laps || [];
        const splitRow = [sw.name, 'SPLIT'];
        if (laps.length === 0) {
          splitRow.push(formatTime(getElapsedTime(sw)));
        } else {
          laps.forEach(lap => splitRow.push(lap.splitTime));
        }
        aoa.push(splitRow);
      });
      return aoa;
    }

    window.exportExcel = () => {
      if (typeof XLSX === 'undefined') return alert("Excel出力ライブラリの読み込みに失敗しました");
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("出力するデータがありません");
      const aoa = generateExportData();
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Result");
      XLSX.writeFile(wb, getDefaultFileName('xlsx'));
    };

    window.exportCsv = () => {
      if (typeof XLSX === 'undefined') return alert("CSV出力ライブラリの読み込みに失敗しました");
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("出力するデータがありません");
      const aoa = generateExportData();
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const csv = XLSX.utils.sheet_to_csv(ws);
      const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = getDefaultFileName('csv');
      link.click();
    };

    window.openPreviewModal = () => {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("表示するデータがありません");

      const aoa = generateExportData();
      const container = document.getElementById('previewTableContainer');

      let tableHtml = `<table class="w-auto text-xs text-left border-collapse"><thead><tr class="bg-slate-100 font-bold border-b border-slate-300">`;
      aoa[0].forEach(col => {
        tableHtml += `<th class="p-2 border-r border-slate-200 whitespace-nowrap">${col}</th>`;
      });
      tableHtml += `</tr></thead><tbody>`;

      for (let i = 1; i < aoa.length; i++) {
        tableHtml += `<tr class="bg-white border-b border-slate-200">`;
        aoa[i].forEach((cell, cellIdx) => {
          const fontClass = cellIdx >= 2 ? 'font-mono' : 'font-bold';
          tableHtml += `<td class="p-2 border-r border-slate-200 whitespace-nowrap ${fontClass}">${cell || ''}</td>`;
        });
        tableHtml += `</tr>`;
      }
      tableHtml += `</tbody></table>`;

      container.innerHTML = tableHtml;
      document.getElementById('previewModal').classList.remove('hidden');
    };

    window.closePreviewModal = () => {
      document.getElementById('previewModal').classList.add('hidden');
    };

    window.copyTableToClipboard = () => {
      const table = document.querySelector('#previewTableContainer table');
      if (!table) return;
      let tsv = [];
      for (let row of table.rows) {
        let cells = Array.from(row.cells).map(c => c.innerText);
        tsv.push(cells.join('\t'));
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(tsv.join('\n')).then(() => showToast('コピーしました！'));
      }
    };

    function renderStructure() {
      const app = document.getElementById('app');
      if (!app) return;
      const keys = Object.keys(state.stopwatches);
      document.getElementById('count').innerText = keys.length;

      const selectAllCb = document.getElementById('selectAllCheckbox');
      if (selectAllCb) {
        selectAllCb.checked = keys.length > 0 && keys.every(k => selectedIds.has(k));
      }

      app.innerHTML = keys.map(id => {
        const sw = state.stopwatches[id];
        const isSelected = selectedIds.has(id);
        const laps = sw.laps || [];

        const lapsHtml = laps.slice().reverse().map((lap, idx) => {
          const lapNo = laps.length - idx;
          return `
            <div class="flex justify-between items-center text-[10px] py-0.5 border-b border-slate-100 font-mono leading-none h-[20px]">
              <span class="text-slate-400 font-bold">P${lapNo}</span>
              <span class="text-slate-600">LAP: ${lap.lapTime}</span>
              <span class="text-slate-800 font-bold">SPLIT: ${lap.splitTime}</span>
            </div>
          `;
        }).join('');

        return `
          <!-- カード縦幅固定：h-48 -->
          <div class="bg-white rounded-xl shadow-sm border ${isSelected ? 'border-blue-500 ring-2 ring-blue-200' : 'border-slate-200'} p-2 flex flex-col justify-between h-48 transition-all">
            <div class="flex items-center justify-between gap-1 mb-1 pb-1 border-b border-slate-100">
              <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${id}')" class="w-4 h-4 text-blue-600 rounded border-slate-300">
              <input type="text" value="${sw.name}" onchange="updateName('${id}', this.value)" class="font-bold text-xs text-slate-800 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-blue-500 focus:outline-none w-full px-1 py-0.5">
              <button onclick="deleteTimer('${id}')" class="text-slate-400 hover:text-rose-500 p-1 font-bold text-xs" title="削除">✕</button>
            </div>

            <div class="text-center my-0.5">
              <div id="display-${id}" class="font-mono font-black text-2xl tracking-wider ${sw.isRunning ? 'text-blue-600' : 'text-slate-700'}">
                ${formatTime(getElapsedTime(sw))}
              </div>
            </div>

            <div class="grid grid-cols-3 gap-1 my-1">
              <button onclick="toggleStartWithSound('${id}')" class="${sw.isRunning ? 'bg-rose-500 hover:bg-rose-600' : 'bg-emerald-500 hover:bg-emerald-600'} text-white font-bold py-1.5 px-1 rounded text-[11px] active:scale-95 shadow-sm">
                ${sw.isRunning ? 'STOP' : 'START'}
              </button>
              <button onclick="addLapWithSound('${id}')" ${!sw.isRunning ? 'disabled class="bg-slate-200 text-slate-400 font-bold py-1.5 px-1 rounded text-[11px] cursor-not-allowed"' : 'class="bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold py-1.5 px-1 rounded text-[11px] active:scale-95 shadow-sm"'}>
                LAP
              </button>
              <button onclick="resetTimerWithSound('${id}')" ${sw.isRunning ? 'disabled class="bg-slate-200 text-slate-400 font-bold py-1.5 px-1 rounded text-[11px] cursor-not-allowed"' : 'class="bg-slate-500 hover:bg-slate-600 active:bg-slate-700 text-white font-bold py-1.5 px-1 rounded text-[11px] active:scale-95 shadow-sm"'}>
                RESET
              </button>
            </div>

            <!-- タイム表示エリア（高さ固定：22pxで1行のみ可視） -->
            <div id="lapContainer-${id}" class="h-[22px] overflow-y-auto no-scrollbar bg-slate-50/80 rounded px-1 border border-slate-100 mt-1">
              ${lapsHtml || '<div class="text-[10px] text-slate-400 text-center py-0.5 leading-none">記録なし</div>'}
            </div>
          </div>
        `;
      }).join('');
    }

    function updateDisplays() {
      const keys = Object.keys(state.stopwatches);
      keys.forEach(id => {
        const sw = state.stopwatches[id];
        const displayEl = document.getElementById(`display-${id}`);
        if (displayEl && sw) {
          displayEl.innerText = formatTime(getElapsedTime(sw));
        }
      });
      requestAnimationFrame(updateDisplays);
    }

    window.addEventListener('DOMContentLoaded', () => {
      requestWakeLock();
      if (Object.keys(state.stopwatches).length === 0) {
        const now = Date.now();
        for (let i = 1; i <= 3; i++) {
          const id = 'sw_' + now + '_' + i;
          state.stopwatches[id] = {
            id,
            name: `艇 ${i}`,
            isRunning: false,
            startTime: 0,
            accumulatedTime: 0,
            laps: []
          };
        }
      }
      renderStructure();
      initP2P();
      requestAnimationFrame(updateDisplays);
    });
  </script>
</body>
</html>
