<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rowing マルチストップウォッチ</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS for P2P Realtime Sync -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- SheetJS for Excel Export -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    button, input, label, select {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-10 text-slate-800 antialiased selection:bg-blue-200">

  <div class="max-w-[1600px] mx-auto px-2 pt-2">

    <!-- ヘッダー・操作コントロールバー -->
    <header class="bg-white/95 backdrop-blur-md p-2 sm:p-3 rounded-xl shadow-md border border-slate-200/80 mb-3 sticky top-1 z-30">
      
      <!-- ステータス ＆ 部屋コード ＆ URL共有 -->
      <div class="flex flex-wrap items-center justify-between gap-1.5 border-b border-slate-100 pb-2 mb-2 text-xs">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span id="statusBadge" class="px-2 py-0.5 font-bold rounded-full bg-emerald-100 text-emerald-800 flex items-center gap-1 text-[11px]">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span id="statusText">接続準備中...</span>
          </span>
          <div class="flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded border border-slate-200 text-[11px]">
            <span class="text-slate-500 font-medium">共有ID:</span>
            <span id="roomCodeDisplay" class="font-mono font-bold text-blue-600"></span>
          </div>
        </div>

        <button onclick="copyShareUrl()" class="flex items-center gap-1 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold px-2.5 py-1 rounded text-[11px] shadow-sm transition active:scale-95">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
          共有URLコピー
        </button>
      </div>

      <!-- コントロールボタン群 -->
      <div class="space-y-1.5">
        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-1.5 cursor-pointer font-bold text-slate-700 bg-slate-50 px-2 py-0.5 rounded border border-slate-200 hover:bg-slate-100 transition">
            <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(event)" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500">
            <span>全選択</span>
          </label>
          <div class="font-bold bg-blue-50 text-blue-700 px-2 py-0.5 rounded border border-blue-200 text-xs">
            登録艇数: <span id="count" class="text-sm text-blue-800 font-black">0</span> / 100
          </div>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:flex md:flex-wrap items-center gap-1.5 text-xs">
          <button onclick="batchStart()" class="col-span-2 sm:col-span-1 min-h-[34px] bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold px-2.5 py-1 rounded-lg shadow-sm flex items-center justify-center gap-1 transition active:scale-95">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
            選択一斉START
          </button>

          <button onclick="addTimer()" class="min-h-[34px] bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold px-2.5 py-1 rounded-lg shadow-sm flex items-center justify-center gap-1 transition active:scale-95">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            追加
          </button>

          <button onclick="removeTimer()" class="min-h-[34px] bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold px-2.5 py-1 rounded-lg shadow-sm flex items-center justify-center gap-1 transition active:scale-95">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
            削除
          </button>

          <button onclick="stopAllTimers()" class="min-h-[34px] bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white font-bold px-2.5 py-1 rounded-lg shadow-sm flex items-center justify-center gap-1 transition active:scale-95">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd"></path></svg>
            全体STOP
          </button>

          <button onclick="resetAllTimers()" class="min-h-[34px] bg-slate-600 hover:bg-slate-700 active:bg-slate-800 text-white font-bold px-2.5 py-1 rounded-lg shadow-sm flex items-center justify-center gap-1 transition active:scale-95">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            全体リセット
          </button>

          <button onclick="shareLineCSV()" class="min-h-[34px] bg-[#06C755] hover:bg-[#05b34c] active:bg-[#049a41] text-white font-bold px-2.5 py-1 rounded-lg shadow-sm flex items-center justify-center gap-1 transition active:scale-95 md:ml-auto">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M24 10.304c0-5.231-5.383-9.471-12-9.471s-12 4.24-12 9.471c0 4.69 4.269 8.601 10.026 9.324.39.085.922.258 1.057.591.121.301.079.766.038 1.08-.085.643-.389 2.493-.423 2.882-.057.659.308.647.647.433.339-.214 5.39-3.178 7.362-5.441 3.252-1.986 5.302-5.021 5.302-8.869z"/></svg>
            LINE送信
          </button>

          <button onclick="shareGmailCSV()" class="min-h-[34px] bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white font-bold px-2.5 py-1 rounded-lg shadow-sm flex items-center justify-center gap-1 transition active:scale-95">
            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L12 9.545l8.073-6.052c1.618-1.214 3.927-.059 3.927 1.964z"/></svg>
            Gmail送信
          </button>

          <button onclick="exportExcel()" class="min-h-[34px] bg-slate-900 hover:bg-black text-white font-bold px-2.5 py-1 rounded-lg shadow-sm flex items-center justify-center gap-1 transition active:scale-95">
            <svg class="w-3.5 h-3.5 text-emerald-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
            Excel出力
          </button>
        </div>
      </div>
    </header>

    <!-- 通知トースト -->
    <div id="toast" class="fixed bottom-4 right-4 bg-slate-900 text-white px-3.5 py-2 rounded-xl shadow-2xl text-xs font-bold transition-all transform translate-y-20 opacity-0 z-50 flex items-center gap-2 border border-slate-700">
      <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
      <span id="toastMsg">URLをコピーしました！</span>
    </div>

    <!-- ストップウォッチカード一覧 -->
    <main id="app" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2"></main>

  </div>

  <script>
    let state = { stopwatches: {} };
    let selectedIds = new Set();
    let isHost = true;
    let peer = null;
    let hostConn = null;
    let clientConns = [];

    let roomCode = location.hash.replace('#', '');
    if (!roomCode) {
      roomCode = 'rowing-' + Math.floor(1000 + Math.random() * 9000);
      location.hash = roomCode;
    }
    document.getElementById('roomCodeDisplay').innerText = roomCode;
    const hostPeerId = `rowing-app-room-v12-${roomCode}`;

    function initP2P() {
      try {
        peer = new Peer(hostPeerId);
        
        peer.on('open', () => {
          isHost = true;
          updateStatus('ホスト', 'bg-emerald-100 text-emerald-800 border-emerald-300');
        });

        peer.on('connection', (conn) => {
          clientConns.push(conn);
          conn.on('open', () => conn.send({ type: 'SYNC_STATE', state }));
          conn.on('data', (data) => handleAction(data));
          conn.on('close', () => {
            clientConns = clientConns.filter(c => c !== conn);
          });
        });

        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            isHost = false;
            peer = new Peer();
            peer.on('open', () => {
              hostConn = peer.connect(hostPeerId);
              updateStatus('参加中', 'bg-blue-100 text-blue-800 border-blue-300');
              
              hostConn.on('data', (data) => {
                if (data.type === 'SYNC_STATE') {
                  state = data.state;
                  renderStructure();
                }
              });
              
              hostConn.on('close', () => {
                updateStatus('切断', 'bg-rose-100 text-rose-800 border-rose-300');
              });
            });
          } else {
            updateStatus('スタンドアロン', 'bg-amber-100 text-amber-800 border-amber-300');
          }
        });
      } catch (e) {
        updateStatus('スタンドアロン', 'bg-amber-100 text-amber-800 border-amber-300');
      }
    }

    function updateStatus(text, colorClass) {
      const badge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');
      if (badge && statusText) {
        statusText.innerText = text;
        badge.className = `px-2 py-0.5 font-bold rounded-full flex items-center gap-1 border text-[10px] ${colorClass}`;
      }
    }

    function dispatchAction(action) {
      handleAction(action);
      if (isHost) broadcastState();
      else if (hostConn && hostConn.open) hostConn.send(action);
    }

    function handleAction(action) {
      const now = Date.now();
      const keys = Object.keys(state.stopwatches);

      switch (action.type) {
        case 'ADD':
          if (keys.length >= 100) return alert("最大100艇まで登録可能です");
          const id = 'sw_' + now + '_' + Math.floor(Math.random() * 1000);
          state.stopwatches[id] = {
            id,
            name: `艇 ${keys.length + 1}`,
            isRunning: false,
            startTime: 0,
            accumulatedTime: 0,
            laps: []
          };
          break;

        case 'DELETE':
          delete state.stopwatches[action.id];
          selectedIds.delete(action.id);
          break;

        case 'DELETE_SELECTED':
          selectedIds.forEach(swId => delete state.stopwatches[swId]);
          selectedIds.clear();
          break;

        case 'REMOVE_LAST':
          if (keys.length > 0) {
            const lastId = keys[keys.length - 1];
            delete state.stopwatches[lastId];
            selectedIds.delete(lastId);
          }
          break;

        case 'RESET':
          if (state.stopwatches[action.id]) {
            state.stopwatches[action.id].isRunning = false;
            state.stopwatches[action.id].startTime = 0;
            state.stopwatches[action.id].accumulatedTime = 0;
            state.stopwatches[action.id].laps = [];
          }
          break;

        case 'RESET_ALL':
          Object.keys(state.stopwatches).forEach(swId => {
            const sw = state.stopwatches[swId];
            sw.isRunning = false;
            sw.startTime = 0;
            sw.accumulatedTime = 0;
            sw.laps = [];
          });
          break;

        case 'STOP_ALL':
          Object.keys(state.stopwatches).forEach(swId => {
            const sw = state.stopwatches[swId];
            if (sw && sw.isRunning) {
              const currentSplit = sw.accumulatedTime + (now - sw.startTime);
              const laps = sw.laps || [];
              const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
              const lapDuration = currentSplit - lastSplit;

              laps.push({
                lapTime: formatTime(lapDuration),
                splitTime: formatTime(currentSplit),
                rawSplit: currentSplit,
                timestamp: now,
                type: 'STOP'
              });

              sw.accumulatedTime = currentSplit;
              sw.isRunning = false;
              sw.startTime = 0;
              sw.laps = laps;
            }
          });
          break;

        case 'TOGGLE_START':
          const sw = state.stopwatches[action.id];
          if (sw) {
            if (sw.isRunning) {
              const currentSplit = sw.accumulatedTime + (now - sw.startTime);
              const laps = sw.laps || [];
              const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
              const lapDuration = currentSplit - lastSplit;

              laps.push({
                lapTime: formatTime(lapDuration),
                splitTime: formatTime(currentSplit),
                rawSplit: currentSplit,
                timestamp: now,
                type: 'STOP'
              });

              sw.accumulatedTime = currentSplit;
              sw.isRunning = false;
              sw.startTime = 0;
              sw.laps = laps;
            } else {
              sw.isRunning = true;
              sw.startTime = now;
            }
          }
          break;

        case 'ADD_LAP':
          const swLap = state.stopwatches[action.id];
          if (swLap && swLap.isRunning) {
            const currentSplit = swLap.accumulatedTime + (now - swLap.startTime);
            const laps = swLap.laps || [];
            const lastSplit = laps.length > 0 ? laps[laps.length - 1].rawSplit : 0;
            const lapDuration = currentSplit - lastSplit;

            laps.push({
              lapTime: formatTime(lapDuration),
              splitTime: formatTime(currentSplit),
              rawSplit: currentSplit,
              timestamp: now,
              type: 'LAP'
            });
            swLap.laps = laps;
          }
          break;

        case 'UPDATE_NAME':
          if (state.stopwatches[action.id]) {
            state.stopwatches[action.id].name = action.name;
          }
          break;

        case 'BATCH_START':
          (action.ids || []).forEach(swId => {
            const target = state.stopwatches[swId];
            if (target && !target.isRunning) {
              target.isRunning = true;
              target.startTime = now;
            }
          });
          break;
      }

      if (isHost) broadcastState();
      renderStructure();
    }

    function broadcastState() {
      clientConns.forEach(conn => {
        if (conn.open) conn.send({ type: 'SYNC_STATE', state });
      });
    }

    window.addTimer = () => dispatchAction({ type: 'ADD' });
    window.deleteTimer = (id) => dispatchAction({ type: 'DELETE', id });
    window.removeTimer = () => {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("削除する艇がありません");

      if (selectedIds.size > 0) {
        if (confirm(`選択中の ${selectedIds.size} 艇を削除しますか？`)) {
          dispatchAction({ type: 'DELETE_SELECTED' });
        }
      } else {
        dispatchAction({ type: 'REMOVE_LAST' });
      }
    };
    window.resetTimer = (id) => dispatchAction({ type: 'RESET', id });
    window.stopAllTimers = () => dispatchAction({ type: 'STOP_ALL' });
    window.resetAllTimers = () => {
      if (confirm("すべてのストップウォッチをリセットしますか？\n（計測記録が消去されます）")) {
        dispatchAction({ type: 'RESET_ALL' });
      }
    };
    window.toggleStart = (id) => dispatchAction({ type: 'TOGGLE_START', id });
    window.addLap = (id) => dispatchAction({ type: 'ADD_LAP', id });
    window.updateName = (id, name) => dispatchAction({ type: 'UPDATE_NAME', id, name });
    window.batchStart = () => {
      if (selectedIds.size === 0) return alert("対象艇にチェックを入れて選択してください");
      dispatchAction({ type: 'BATCH_START', ids: Array.from(selectedIds) });
    };

    // mm:ss.00 フォーマット
    function formatTime(ms) {
      if (!ms || ms < 0) ms = 0;
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const h = Math.floor((ms % 1000) / 10);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(h).padStart(2, '0')}`;
    }

    function getElapsedTime(sw) {
      if (!sw) return 0;
      let elapsed = sw.accumulatedTime || 0;
      if (sw.isRunning && sw.startTime) {
        elapsed += (Date.now() - sw.startTime);
      }
      return elapsed;
    }

    window.toggleSelect = (id) => {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
      renderStructure();
    };

    window.toggleSelectAll = (e) => {
      const keys = Object.keys(state.stopwatches);
      if (e.target.checked) keys.forEach(id => selectedIds.add(id));
      else selectedIds.clear();
      renderStructure();
    };

    window.copyShareUrl = () => {
      const baseUrl = location.origin + location.pathname;
      const shareUrl = `${baseUrl}?openExternalBrowser=1#${roomCode}`;
      
      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast("共有URLをコピーしました！");
      }).catch(() => {
        prompt("以下のURLをコピーして送信してください:", shareUrl);
      });
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (toast && toastMsg) {
        toastMsg.innerText = msg;
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => {
          toast.classList.add('translate-y-20', 'opacity-0');
        }, 2500);
      }
    }

    // CSVデータ生成共通処理
    function generateCSVText() {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) {
        alert("送信する計測データがありません");
        return null;
      }

      let maxLaps = 0;
      Object.values(state.stopwatches).forEach(sw => {
        const lCount = (sw.laps || []).length;
        if (lCount > maxLaps) maxLaps = lCount;
      });

      const header = ['艇名', '種別'];
      for (let i = 1; i <= maxLaps; i++) {
        header.push(`LAP${i}`);
      }
      const csvRows = [header.join(',')];

      Object.values(state.stopwatches).forEach(sw => {
        const laps = sw.laps || [];
        const splitRow = [`"${sw.name.replace(/"/g, '""')}"`, 'SPLIT'];
        const lapRow = [`"${sw.name.replace(/"/g, '""')}"`, 'LAP'];

        if (laps.length === 0) {
          splitRow.push(formatTime(getElapsedTime(sw)));
          lapRow.push('-');
        } else {
          laps.forEach(lap => {
            splitRow.push(lap.splitTime);
            lapRow.push(lap.type === 'STOP' ? `${lap.lapTime}(STOP)` : lap.lapTime);
          });
        }

        csvRows.push(splitRow.join(','));
        csvRows.push(lapRow.join(','));
      });

      return csvRows.join('\n');
    }

    // LINEへデータ送信（Web Share API + LINE URLスキーム修復版）
    window.shareLineCSV = async () => {
      const csvText = generateCSVText();
      if (!csvText) return;

      const today = new Date().toISOString().slice(0, 10);
      const fileName = `Rowing_Result_${today}.csv`;
      const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvText], { type: 'text/csv;charset=utf-8;' });
      const file = new File([blob], fileName, { type: 'text/csv' });

      // 1. Web Share APIでファイル共有（スマホ環境でLINEを選べます）
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: 'Rowing計測結果CSV',
            text: 'Rowingストップウォッチ計測データです。'
          });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // 2. LINEアプリのスキーム直接起動 fallback
      const textMessage = `【Rowing計測結果 (${today})】\n` + csvText;
      const encodedMsg = encodeURIComponent(textMessage);

      if (encodedMsg.length > 2000) {
        alert("データ量が多いため、LINEテキスト送信制限を超えています。Excel出力機能をご利用ください。");
        return;
      }

      // LINE URLスキームを起動
      window.location.href = `https://line.me/R/msg/text/?${encodedMsg}`;
    };

    // Gmailアプリへデータ送信
    window.shareGmailCSV = async () => {
      const csvText = generateCSVText();
      if (!csvText) return;

      const today = new Date().toISOString().slice(0, 10);
      const fileName = `Rowing_Result_${today}.csv`;
      const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csvText], { type: 'text/csv;charset=utf-8;' });
      const file = new File([blob], fileName, { type: 'text/csv' });

      // 1. Web Share API（スマホの共有メニューからGmailアプリを選択）
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: `Rowing計測結果_${today}`,
            text: 'Rowingストップウォッチ計測データです。'
          });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }

      // 2. mailto: スキームでメーラー/Gmailアプリ起動
      const subject = encodeURIComponent(`Rowing計測結果 (${today})`);
      const body = encodeURIComponent(`Rowingストップウォッチの計測結果データです:\n\n${csvText}`);
      
      window.location.href = `mailto:?subject=${subject}&body=${body}`;
    };

    // Excel書き出し
    window.exportExcel = () => {
      const keys = Object.keys(state.stopwatches);
      if (keys.length === 0) return alert("出力するデータがありません");

      const today = new Date().toISOString().slice(0, 10);
      const defaultFileName = `Rowing_Result_${today}`;
      
      const userInput = prompt("保存するExcelファイル名を入力してください:", defaultFileName);
      if (userInput === null) return;
      
      const fileName = userInput.trim() || defaultFileName;
      const finalFileName = fileName.endsWith('.xlsx') ? fileName : `${fileName}.xlsx`;

      const aoa = [];
      let maxLaps = 0;
      Object.values(state.stopwatches).forEach(sw => {
        const lCount = (sw.laps || []).length;
        if (lCount > maxLaps) maxLaps = lCount;
      });

      const header = ['艇名', 'データ種別'];
      for (let i = 1; i <= maxLaps; i++) {
        header.push(`LAP${i}`);
      }
      aoa.push(header);

      Object.values(state.stopwatches).forEach(sw => {
        const laps = sw.laps || [];
        const splitRow = [sw.name, 'SPLIT'];
        const lapRow = [sw.name, 'LAP'];

        if (laps.length === 0) {
          splitRow.push(formatTime(getElapsedTime(sw)));
          lapRow.push('-');
        } else {
          laps.forEach(lap => {
            const splitLabel = lap.splitTime;
            const lapLabel = lap.type === 'STOP' ? `${lap.lapTime} [STOP]` : lap.lapTime;
            splitRow.push(splitLabel);
            lapRow.push(lapLabel);
          });
        }

        aoa.push(splitRow);
        aoa.push(lapRow);
      });

      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Rowing計測結果");
      XLSX.writeFile(wb, finalFileName);
    };

    // UI描画
    function renderStructure() {
      const container = document.getElementById("app");
      const keys = Object.keys(state.stopwatches);
      document.getElementById("count").innerText = keys.length;

      const allSelected = keys.length > 0 && keys.every(id => selectedIds.has(id));
      const selectAllEl = document.getElementById("selectAllCheckbox");
      if (selectAllEl) selectAllEl.checked = allSelected;

      if (keys.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white p-6 rounded-xl shadow-sm text-center border border-slate-200 py-10">
            <p class="text-slate-700 font-bold text-sm mb-1">ストップウォッチがありません</p>
            <p class="text-xs text-slate-400 mb-3">「+ 追加」を押してスタートしてください</p>
            <button onclick="addTimer()" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold px-3 py-1.5 rounded-lg shadow text-xs">
              + 追加
            </button>
          </div>
        `;
        return;
      }

      container.innerHTML = keys.map(id => {
        const sw = state.stopwatches[id];
        const laps = sw.laps || [];
        const isSelected = selectedIds.has(id);

        return `
          <div class="bg-white p-2 rounded-xl shadow-sm border transition-all ${
            sw.isRunning 
              ? 'border-emerald-500 ring-2 ring-emerald-100' 
              : isSelected 
                ? 'border-blue-500 ring-2 ring-blue-100 bg-blue-50/10' 
                : 'border-slate-200'
          }">
            
            <!-- ヘッダー (選択 + 艇名 + 削除) -->
            <div class="flex items-center justify-between gap-1 mb-1">
              <div class="flex items-center gap-1 flex-1 min-w-0">
                <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${id}')" class="w-3.5 h-3.5 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer flex-shrink-0">
                <input type="text" value="${sw.name}" onchange="updateName('${id}', this.value)" placeholder="艇名" class="font-bold text-slate-800 text-xs border-b border-transparent hover:border-slate-300 focus:border-blue-500 focus:outline-none w-full bg-transparent px-0.5 py-0.5 truncate">
              </div>

              <button onclick="deleteTimer('${id}')" title="削除" class="text-slate-300 hover:text-rose-500 p-0.5 rounded transition flex-shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>

            <!-- mm:ss.00 タイム表示 -->
            <div class="bg-slate-900 text-emerald-400 font-mono font-black text-xl sm:text-2xl text-center py-1.5 px-1 rounded-lg my-1 shadow-inner border border-slate-800 tracking-tight">
              <span id="display-${id}">${formatTime(getElapsedTime(sw))}</span>
            </div>

            <!-- 操作ボタン -->
            <div class="grid grid-cols-3 gap-1 my-1.5">
              <button onclick="toggleStart('${id}')" class="min-h-[32px] rounded-lg font-bold text-white shadow active:scale-95 transition-all text-[11px] flex items-center justify-center ${sw.isRunning ? 'bg-rose-500 hover:bg-rose-600' : 'bg-emerald-600 hover:bg-emerald-700'}">
                ${sw.isRunning ? 'STOP' : 'START'}
              </button>
              
              <button onclick="addLap('${id}')" ${!sw.isRunning ? 'disabled' : ''} class="min-h-[32px] rounded-lg font-bold bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white shadow active:scale-95 transition-all text-[11px] flex items-center justify-center disabled:opacity-30">
                LAP
              </button>

              <button onclick="resetTimer('${id}')" class="min-h-[32px] rounded-lg font-bold bg-slate-500 hover:bg-slate-600 text-white shadow active:scale-95 transition-all text-[11px] flex items-center justify-center">
                RESET
              </button>
            </div>

            <!-- LAP / SPLIT 履歴 -->
            <div class="border-t border-slate-100 pt-1 text-[10px] font-mono">
              <div class="flex justify-between items-center text-slate-400 mb-0.5 px-0.5 font-sans font-bold text-[9px]">
                <span>No.</span>
                <div class="flex items-center gap-1.5">
                  <span class="text-amber-600">LAP</span>
                  <span class="text-slate-300">|</span>
                  <span class="text-blue-600">SPLIT</span>
                </div>
              </div>
              
              <div class="max-h-20 overflow-y-auto space-y-0.5 pr-0.5">
                ${laps.length === 0 ? '<div class="text-center text-slate-300 py-1 font-sans text-[10px]">記録なし</div>' : 
                  laps.slice().reverse().map((lap, i) => `
                    <div class="py-0.5 px-1 rounded flex items-center justify-between ${lap.type === 'STOP' ? 'bg-rose-50 border border-rose-100' : 'bg-slate-50 border border-slate-100'}">
                      <span class="font-bold text-[9px] ${lap.type === 'STOP' ? 'text-rose-600' : 'text-slate-400'}">
                        #${laps.length - i}${lap.type === 'STOP' ? ' (STOP)' : ''}
                      </span>
                      <div class="flex items-center gap-1 font-bold text-[10px]">
                        <span class="text-amber-600">${lap.lapTime}</span>
                        <span class="text-slate-300 font-normal">|</span>
                        <span class="text-blue-600">${lap.splitTime}</span>
                      </div>
                    </div>
                  `).join('')
                }
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function updateTimerNumbers() {
      Object.keys(state.stopwatches).forEach(id => {
        const sw = state.stopwatches[id];
        if (sw && sw.isRunning) {
          const el = document.getElementById(`display-${id}`);
          if (el) {
            el.innerText = formatTime(getElapsedTime(sw));
          }
        }
      });
      requestAnimationFrame(updateTimerNumbers);
    }

    initP2P();
    renderStructure();
    requestAnimationFrame(updateTimerNumbers);
  </script>
</body>
</html>
